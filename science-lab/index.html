<style>
/* Layout concept: an exam-room workbench. A quiet selection rail on the left,
   the question on a sheet of graph paper in the middle, instruments (timer, pace) pinned above it. */
:root {
  --paper: #f3f5f9;
  --surface: #ffffff;
  --sheet: #fbfcfe;
  --ink: #142036;
  --muted: #5b667c;
  --line: #d8deea;
  --accent: #2547c9;
  --accent-soft: #e6ecfd;
  --grid: rgba(37, 71, 201, 0.07);
  --grid-major: rgba(37, 71, 201, 0.15);
  --good: #13744f;
  --good-soft: #e1f4ea;
  --bad: #c0392b;
  --bad-soft: #fbe7e4;
  --warn: #8f5609;
  --hl: #7c3aed; --hl-soft: #f1eafe;
  --warn-soft: #fbf0dc;
  --chili: #d23c1c;
  --chili-off: #c9cfdb;
  --shadow: 0 1px 2px rgba(20, 32, 54, 0.06), 0 6px 18px rgba(20, 32, 54, 0.06);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d121c; --surface: #151c2a; --sheet: #121927; --ink: #e5eaf4; --muted: #96a1b6; --line: #2a3447;
    --accent: #85a2ff; --accent-soft: #1d2847; --grid: rgba(133, 162, 255, 0.06); --grid-major: rgba(133, 162, 255, 0.13);
    --good: #4cc690; --good-soft: #143326; --bad: #ff7b6b; --bad-soft: #3a1c1a; --warn: #f0b552; --warn-soft: #382a12; --hl: #b69cff; --hl-soft: #2a1f47; --on-accent: #0d121c;
    --chili: #ff6b47; --chili-off: #3b4558; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d121c; --surface: #151c2a; --sheet: #121927; --ink: #e5eaf4; --muted: #96a1b6; --line: #2a3447;
  --accent: #85a2ff; --accent-soft: #1d2847; --grid: rgba(133, 162, 255, 0.06); --grid-major: rgba(133, 162, 255, 0.13);
  --good: #4cc690; --good-soft: #143326; --bad: #ff7b6b; --bad-soft: #3a1c1a; --warn: #f0b552; --warn-soft: #382a12; --hl: #b69cff; --hl-soft: #2a1f47; --on-accent: #0d121c;
  --chili: #ff6b47; --chili-off: #3b4558; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1240px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 20px; font-weight: 500; font-stretch: 108%; }
.brand .mvp { font-weight: 900; color: var(--accent); }
.brand .trophy { font-size: 17px; }
.brand .tag { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); letter-spacing: 0.04em; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 8px; font-weight: 500; white-space: nowrap; font-size: 14px; }
nav.tabs a:hover { color: var(--ink); background: var(--paper); }
nav.tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* ---------- shell ---------- */
.shell { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .shell { grid-template-columns: minmax(0, 1fr); } }

/* ---------- selection rail ---------- */
aside.rail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 90px); overflow: auto; }
@media (max-width: 860px) { aside.rail { position: static; max-height: none; } }
.rail-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); gap: 8px; }
.rail-head h2 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.rail-count { font-size: 13px; color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 500; margin-left: 4px; }
.rail-toggle { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
@media (max-width: 860px) { .rail-toggle { display: inline-block; } aside.rail.collapsed .rail-body { display: none; } }
.rail-body { padding: 12px 16px 16px; display: grid; gap: 16px; }
.fieldset { display: grid; gap: 7px; }
.fieldset > .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: max-content; }
.seg button { border: 0; background: transparent; padding: 5px 14px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chip:disabled { opacity: .5; cursor: not-allowed; }
.chili { display: inline-flex; gap: 1px; vertical-align: -2px; }
.chili svg { width: 13px; height: 13px; }
.chili .on { fill: var(--chili); } .chili .off { fill: var(--chili-off); }
.tree { display: grid; gap: 4px; }
.tree details { border-radius: 8px; }
.tree summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 5px 4px; cursor: pointer; border-radius: 6px; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary .caret { width: 14px; color: var(--muted); transition: transform .15s; font-size: 11px; text-align: center; }
.tree details[open] > summary .caret { transform: rotate(90deg); }
.tree summary:hover { background: var(--paper); }
.tree .tname { font-weight: 600; font-size: 13.5px; flex: 1; min-width: 0; }
.tree .tid { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.tree .soon { font-size: 11px; color: var(--muted); border: 1px dashed var(--line); padding: 0 6px; border-radius: 99px; }
.tree ul { list-style: none; margin: 2px 0 6px 26px; padding: 0; display: grid; gap: 2px; }
.tree label { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding: 3px 4px; border-radius: 6px; cursor: pointer; }
.tree label:hover { background: var(--paper); }
.tree input[type=checkbox] { accent-color: var(--accent); margin-top: 3px; flex: none; }
.tree .hl { font-size: 10.5px; font-weight: 700; color: var(--hl); background: var(--hl-soft); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 4px; }
.tree .disabled { color: var(--muted); cursor: default; }
.saved { display: grid; gap: 6px; }
.saved-row { display: flex; gap: 6px; }
.saved-row input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; background: var(--sheet); font-size: 13px; }
.saved-list { display: flex; flex-wrap: wrap; gap: 6px; }
.saved-item { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; font-size: 12.5px; }
.saved-item button { border: 0; background: none; padding: 3px 9px; cursor: pointer; }
.saved-item button + button { border-left: 1px solid var(--line); color: var(--muted); padding: 3px 7px; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn.danger { color: var(--bad); }
#rsAsk.btn.danger { background: #b42318; border-color: #b42318; color: #fff; }
#rsAsk.btn.danger:hover { filter: brightness(1.08); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }

/* ---------- main ---------- */
main { min-width: 0; display: grid; gap: 16px; }
.view-head { display: flex; align-items: end; gap: 12px 20px; flex-wrap: wrap; }
.view-head h2 { font-size: 26px; font-weight: 800; font-stretch: 108%; }
.view-head > div { flex: 1 1 auto; min-width: 0; }
.view-head p { margin: 2px 0 0; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; }
.panel h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.empty { text-align: left; padding: 28px 22px; }
.empty h3 { font-size: 18px; margin-bottom: 6px; }

/* question sheet: graph paper */
.sheet { background-color: var(--sheet); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 16px 16px; border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px 22px 22px; display: grid; gap: 14px; min-width: 0; }
@media (max-width: 520px) { .sheet { padding: 16px 14px 18px; } }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; color: var(--muted); }
.qmeta .paper { font-family: var(--f-mono); font-weight: 600; color: var(--surface); background: var(--ink); border-radius: 5px; padding: 1px 7px; font-size: 12px; }
.qmeta .marks { font-family: var(--f-mono); }
.qtitle { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.qbody { font-size: 15.5px; line-height: 1.65; min-width: 0; overflow-wrap: anywhere; }
.qbody p { margin: 0 0 8px; }
.qbody mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 2px 0; }
.qbody mjx-container { max-width: 100%; }

.options { display: grid; gap: 8px; }
.options.graphs { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 10px 14px; cursor: pointer; min-width: 0; }
.opt .letter { font-family: var(--f-mono); font-weight: 600; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--paper); flex: none; font-size: 13px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.picked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.picked .letter { background: var(--accent); color: var(--surface); }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct .letter { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .letter { background: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; }
.options.graphs .opt { flex-direction: column; align-items: flex-start; }
.options.graphs .opt svg { width: 100%; height: auto; }

.verdict { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
.solution { border-top: 1px dashed var(--line); padding-top: 12px; }
.solution h4, .ms h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 6px; }

/* written parts */
.parts { display: grid; gap: 16px; counter-reset: none; }
.part { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; }
.part .plabel { font-family: var(--f-mono); font-weight: 600; }
.part .pmarks { font-family: var(--f-mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.part .pbody { min-width: 0; }
.part .cmd { font-weight: 700; }
.part textarea { grid-column: 2 / 4; width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); resize: vertical; font-size: 14px; }
.ms { grid-column: 2 / 4; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.mp { display: flex; gap: 10px; align-items: flex-start; }
.mp input { accent-color: var(--good); margin-top: 5px; flex: none; width: 16px; height: 16px; }
.mp .mpt { min-width: 0; overflow-wrap: anywhere; }
.ms .notes { font-size: 13.5px; color: var(--muted); border-top: 1px dotted var(--line); padding-top: 6px; }
.ms .pscore { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.ms svg.graph { max-width: 380px; }
.ao { font-family: var(--f-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; }

/* graphs & tables */
svg.graph { width: 100%; max-width: 440px; height: auto; display: block; margin: 6px 0; }
svg.graph.sketch { max-width: 200px; }
.g-minor { stroke: var(--grid-major); stroke-width: .5; opacity: .55; }
.g-major { stroke: var(--grid-major); stroke-width: .9; }
.g-axis { stroke: var(--ink); stroke-width: 1.3; }
.g-tick { fill: var(--muted); font-size: 10.5px; font-family: var(--f-mono); }
.g-label { fill: var(--ink); font-size: 11.5px; font-family: var(--f-body); font-style: italic; }
.g-note { fill: var(--muted); font-size: 10.5px; font-family: var(--f-body); }
.g-line { stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.g-fit { stroke: var(--accent); stroke-width: 1.6; fill: none; }
.g-alt { stroke: var(--warn); stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
.g-err { stroke: var(--ink); stroke-width: 1; }
.g-pt line { stroke: var(--ink); stroke-width: 1.6; }
.tbl-wrap { overflow-x: auto; max-width: 100%; margin: 4px 0 8px; }
table.data { border-collapse: collapse; font-size: 14px; background: var(--surface); }
table.data th, table.data td { border: 1px solid var(--line); padding: 5px 12px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data th { font-weight: 600; background: var(--paper); }
table.stats { border-collapse: collapse; width: 100%; font-size: 14px; }
table.stats th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); }
table.stats td { padding: 8px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: middle; }
table.stats tr:last-child td { border-bottom: 0; }

/* pill states */
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 99px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.neutral { background: var(--paper); color: var(--muted); }

/* timer instrument */
.instrument { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; display: grid; gap: 8px; box-shadow: var(--shadow); }
@media (max-width: 700px) { .instrument { top: calc(env(safe-area-inset-top, 0px) + 92px); } }
.clock { font-family: var(--f-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.clock.over { color: var(--bad); }
.clock.low { color: var(--warn); }
.pace { position: relative; height: 10px; background: var(--paper); border-radius: 99px; overflow: hidden; }
.pace .done { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; transition: width .3s; }
.pace .exp { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.pace.behind .done { background: var(--warn); }
.pace-legend { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.palette { display: flex; flex-wrap: wrap; gap: 5px; }
.palette button { min-width: 34px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--f-mono); font-size: 12.5px; }
.palette button.answered { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.palette button.current { outline: 2px solid var(--ink); outline-offset: 1px; }

/* forms */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 18px; }
.field { display: grid; gap: 5px; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field select, .field input[type=number], textarea.code { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); }
.switch { display: flex; gap: 9px; align-items: center; font-size: 14px; cursor: pointer; }
.switch input { accent-color: var(--accent); width: 16px; height: 16px; }

/* recall card */
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 26px 26px 22px; display: grid; gap: 16px; min-height: 230px; }
.card .ctype { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; display: flex; gap: 10px; align-items: center; }
.card .front { font-size: 18px; line-height: 1.55; }
.card .front ol { margin: 10px 0 0; padding-left: 22px; font-size: 15.5px; display: grid; gap: 6px; }
.card .back { font-size: 16px; border-top: 1px dashed var(--line); padding-top: 14px; }
.rate { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rate button { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 6px; cursor: pointer; font-weight: 600; display: grid; gap: 1px; font-size: 14px; }
.rate button small { font-weight: 400; color: var(--muted); font-size: 11.5px; font-family: var(--f-mono); }
.rate button:hover { border-color: var(--accent); }
.rate .again { color: var(--bad); } .rate .easy { color: var(--good); }
.conf { display: flex; gap: 8px; flex-wrap: wrap; }
.flag { color: var(--warn); font-weight: 600; font-size: 13px; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.tile .v { font-family: var(--f-display); font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12.5px; color: var(--muted); }
.bar { height: 8px; background: var(--paper); border-radius: 99px; overflow: hidden; min-width: 80px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.good > i { background: var(--good); } .bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }

/* notes */
.note { display: grid; gap: 10px; }
.note h3 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.note h3 .tid { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
.note .booklet { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; overflow-x: auto; }
.note .booklet .bk { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding-top: 6px; }
.note ul { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
.note .mist li::marker { color: var(--bad); }
.note .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 24px; }
.note .cols > div { min-width: 0; }

/* gauntlet */
.big-score { font-family: var(--f-display); font-size: 56px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.flash-ok { animation: flashok .5s; } .flash-no { animation: flashno .5s; }

@keyframes flashno { from { box-shadow: 0 0 0 4px var(--bad); } to { box-shadow: var(--shadow); } }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
.footer { color: var(--muted); font-size: 12.5px; max-width: 70ch; }
/* grid containers size their single column to the container, never to wide content */
main, .sheet, .card, .note, .rail-body, .ms, .parts, .fieldset { grid-template-columns: minmax(0, 1fr); }

.ws summary { cursor: pointer; list-style-position: inside; }

/* theme toggle, top right */

.theme-btn svg path:only-child { fill: currentColor; stroke: none; }
@media (max-width: 700px) { .brand { margin-right: 0; flex: 1 1 auto; min-width: 0; } .hbar { order: 2; } nav.tabs { order: 3; flex-basis: 100%; } }
@media (max-width: 520px) { .brand .tag { display: none; } }

.site-foot { max-width: 1240px; margin: 0 auto; padding-block: 0 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.shell.no-rail { grid-template-columns: minmax(0, 1fr); }
.shell.no-rail aside.rail { display: none; }

/* topic toggles for Blitz, Recall and Notes */
.tchips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 6px; }
.tchip { font: 600 12px/1 var(--f-mono); padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); }
.tchip:disabled { opacity: 0.38; cursor: not-allowed; }

/* exam setup */
p.warn, .warn.small { color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; margin: 8px 0 0; }
p.warn:empty { display: none; }
.exset { display: grid; gap: 0; padding-block: 6px; }

@media (max-width: 600px) { .exrow { grid-template-columns: minmax(0, 1fr); gap: 8px; } .exlab { padding-top: 0; } .exmarks { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ---------- Blitz: Last man standing 💀 ---------- */
.blitz-mode { margin: 4px 0 2px; }
.lms-rules { margin: 4px 0 12px; padding-left: 20px; display: grid; gap: 4px; }
:root.lms:not(#_) {

  --chili: #ff3b3b; --chili-off: #4a2323;

}

:root.lms-over body { background: #8e0000; animation: lms-flash 0.5s steps(2) 3; }

@keyframes lms-pop { 0% { transform: scale(2.2); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.85; } }

/* ---------- recall games ---------- */

.rmode-help { margin: 8px 0 0; }

.gap:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

.gap-no { color: var(--good); font-weight: 700; }
.spot { font-size: 17px; line-height: 2.1; margin: 4px 0; }
.spot .word { font: inherit; border: 1px solid transparent; background: none; color: var(--ink); padding: 2px 3px; border-radius: 6px; cursor: pointer; }
.spot .word:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.spot .word:disabled { cursor: default; }

.note .booklet { background: var(--accent-soft); border: 1.5px solid var(--accent); border-left-width: 5px; border-radius: 10px; padding: 8px 14px 10px; overflow-x: visible; }

.wmodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 8px; }
.wmode { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); text-decoration: none; transition: border-color .15s, transform .15s; }
.wmode:hover, .wmode:focus-visible { border-color: var(--accent); transform: translateY(-1px); }
.wmode .wic { font-size: 22px; } .wmode b { font-family: var(--f-display); font-size: 16px; } .wmode span:last-child { color: var(--muted); font-size: 13.5px; }
.wsteps { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 8px; }
a.btn { text-decoration: none; }
ol.history .hm { font-size: 11.5px; }
/* offline badge (offline copy only) */
.offline-tag { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--warn); color: var(--warn); background: var(--warn-soft); font: 700 10.5px/1.3 var(--f-body); letter-spacing: .06em; text-transform: uppercase; vertical-align: middle; cursor: help; }
.foot-name .offline-tag { vertical-align: 2px; }
/* welcome: full-width intro */
.welcome-hero p { max-width: none; }
/* mode cards on Games and Recall */
.mode-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 14px 0; }
.mode-card { display: grid; gap: 4px; align-content: start; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; transition: border-color .15s, transform .15s; }
.mode-card:hover, .mode-card:focus-visible { border-color: var(--accent); transform: translateY(-1px); }
.mode-card .wic { font-size: 24px; } .mode-card b { font-family: var(--f-display); font-size: 16px; } .mode-card span:last-child { color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.mode-card.soon { cursor: default; opacity: .65; border-style: dashed; } .mode-card.soon:hover { transform: none; border-color: var(--line); }
.mode-back { margin: 0 0 6px; }
.lms-start { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0; } .lms-custom { max-width: 160px; }
.run-review .row { align-items: center; }
/* 1.2: syllabus toggle */
.spec-chips { display: inline-flex; gap: 6px; }
.spec-note { display: block; margin-top: 4px; }
.spec-row { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; }

/* Stats sections (1.3) */
.stat-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
.stat-tab { font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.stat-tab:hover { border-color: var(--accent); }
.stat-tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); }

/* ---------- Unit Detective 🔍 (1.3): Victorian study, gaslight in dark mode ---------- */
.ud-head { display: flex; align-items: center; gap: 14px; margin: 6px 0 16px; }
.ud-head h2 { margin: 0; }
.ud-head p { margin: 2px 0 0; color: var(--muted); }
.ud-badge { font-size: 30px; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--accent); background: var(--surface); flex: none; }
.ud-cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 8px 0 16px; }
.ud-case { position: relative; display: grid; gap: 2px; padding: 12px 12px 12px 40px; border: 1.5px dashed var(--line); border-radius: 6px 14px 6px 6px; background: var(--sheet); cursor: pointer; }
.ud-case input { position: absolute; left: 12px; top: 14px; width: 18px; height: 18px; accent-color: var(--accent); }
.ud-case:has(input:checked) { border-style: solid; border-color: var(--accent); }
.ud-no { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.ud-case b { font-size: 15px; }
.ud-d { font-size: 13px; color: var(--muted); }
.udskill { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.ud-modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 8px 0 12px; }
.ud-mode { font: inherit; text-align: left; display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; }
.ud-mode span { font-size: 13px; color: var(--muted); }
.ud-mode[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.ud-dur { gap: 8px; margin: 0 0 10px; }
.ud-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin: 0 0 10px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.ud-clock { font-size: 22px; font-weight: 700; font-family: var(--f-mono); } .ud-clock.low { color: var(--bad); }
.ud-case-tag { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.ud-case-tag .udskill { margin-left: 6px; }
.ud-hard { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); }
.ud-prompt { font-size: 17px; line-height: 1.55; margin: 4px 0 14px; }
.udu { font-size: 1.15em; white-space: nowrap; }
.udeq { margin: 10px 0 2px; font-size: 1.1em; }
.ud-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ud-opts.two { grid-template-columns: 1fr; }
@media (max-width: 600px) { .ud-opts { grid-template-columns: 1fr; } }
.ud-opt { font: inherit; font-size: 16px; text-align: left; padding: 12px 14px; min-height: 52px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; }
.ud-opt:hover:not(:disabled) { border-color: var(--accent); }
.ud-opt.right { border-color: var(--good); background: var(--good-soft); }
.ud-opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ud-opt:disabled { cursor: default; }
.ud-verdict { margin: 14px 0 10px; padding: 10px 14px; border-radius: 10px; border-left: 4px solid; line-height: 1.55; }
.ud-verdict.good { border-color: var(--good); background: var(--good-soft); } .ud-verdict.bad { border-color: var(--bad); background: var(--bad-soft); }
.ud-verdict b { margin-right: 6px; }
.ud-rev { border-top: 1px solid var(--line); padding: 12px 0; }
.udwhy { margin: 6px 0 4px; padding-left: 20px; } .udwhy li { margin: 2px 0; }
.ud-verdict > span { display: inline; }

/* 1.3: back buttons, backup box, report and feedback */
.mode-back { margin: 0 0 10px; }
.backbtn { font-weight: 600; }
.backup-box { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.report > summary { display: inline-flex; align-items: center; gap: 6px; list-style: none; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.report > summary::-webkit-details-marker { display: none; }
.report > summary:hover { color: var(--bad); border-color: var(--bad); }
.report[open] > summary { color: var(--bad); border-color: var(--bad); margin-bottom: 8px; }
.report summary .flag { font-size: 13px; }
.foot-report .report > summary, .report-general > summary { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-size: 14px; padding: 6px 14px; }
.report-general > summary:hover, .report-general[open] > summary { color: var(--accent); border-color: var(--accent); }
.alpha-sum { margin: 8px 0 4px; padding-left: 20px; display: grid; gap: 4px; }

/* ===== MYPoirier Science Lab: additions to the base stylesheet ===== */
:root { --s1: #0f766e; --s1-soft: #ddf3f0; --s2: #2547c9; --s2-soft: #e6ecfd; --s3: #7c3aed; --s3-soft: #f1eafe; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1: #4fd1c0; --s1-soft: #10302d; --s2: #85a2ff; --s2-soft: #1d2847; --s3: #b69cff; --s3-soft: #2a1f47; } }
:root[data-theme="dark"] { --s1: #4fd1c0; --s1-soft: #10302d; --s2: #85a2ff; --s2-soft: #1d2847; --s3: #b69cff; --s3-soft: #2a1f47; }
/* Year colour (Y9 green, Y10 amber, Y11 purple): a stripe across the top of the header, the MYP brand and the active
   year button. The page itself stays neutral, and buttons and links keep the shared accent. */
:root[data-year="9"] { --year: #15803d; --on-year: #fff; }
:root[data-year="10"] { --year: #b45309; --on-year: #fff; }
:root[data-year="11"] { --year: #6d28d9; --on-year: #fff; }
@media (prefers-color-scheme: dark) {
  :root[data-year="9"]:not([data-theme="light"]) { --year: #4ade80; --on-year: #0d121c; }
  :root[data-year="10"]:not([data-theme="light"]) { --year: #fbbf24; --on-year: #0d121c; }
  :root[data-year="11"]:not([data-theme="light"]) { --year: #b79cff; --on-year: #0d121c; }
}
:root[data-year="9"][data-theme="dark"] { --year: #4ade80; --on-year: #0d121c; }
:root[data-year="10"][data-theme="dark"] { --year: #fbbf24; --on-year: #0d121c; }
:root[data-year="11"][data-theme="dark"] { --year: #b79cff; --on-year: #0d121c; }
:root[data-year] .top { border-top: 5px solid var(--year); }
:root[data-year] .brand .mvp, :root[data-year] .foot-name .mvp { color: var(--year); }
:root[data-year] #yearSeg button[aria-pressed="true"] { background: var(--year); color: var(--on-year); }

/* strand and level tags */
.stag { display: inline-flex; align-items: center; gap: 4px; font: 700 11.5px/1 var(--f-body); padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.stag.s-i { background: var(--s1-soft); color: var(--s1); }
.stag.s-ii { background: var(--s2-soft); color: var(--s2); }
.stag.s-iii { background: var(--s3-soft); color: var(--s3); }
.ltag { font: 600 11.5px/1 var(--f-mono); padding: 4px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.desc-line { font-size: 12.5px; color: var(--muted); font-style: italic; margin: -4px 0 2px; }
.chip.s-i[aria-pressed="true"] { background: var(--s1); border-color: var(--s1); color: var(--surface); }
.chip.s-ii[aria-pressed="true"] { background: var(--s2); border-color: var(--s2); color: var(--surface); }
.chip.s-iii[aria-pressed="true"] { background: var(--s3); border-color: var(--s3); color: var(--surface); }
.chip.lv { font-family: var(--f-mono); }
.year-seg button { padding: 8px 10px; }

/* figures and data inside questions */
.figure { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow-x: auto; margin: 8px 0; }
.figure svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
table.data { border-collapse: collapse; margin: 6px 0; font-size: 14px; background: var(--surface); }
table.data th, table.data td { border: 1px solid var(--line); padding: 5px 10px; text-align: center; }
table.data th { background: var(--accent-soft); font-weight: 600; }
.tablewrap { overflow-x: auto; }

/* answer inputs */
.ansrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
input.ans, select.ans { font: 15px var(--f-mono); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
input.ans { width: 14em; max-width: 100%; }
.ans.right { border-color: var(--good); background: var(--good-soft); }
.ans.wrong { border-color: var(--bad); background: var(--bad-soft); }
textarea.ans { width: 100%; min-height: 110px; font: inherit; font-size: 14px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); resize: vertical; }
.part .pbody .options { margin-top: 6px; }
.orderpool, .orderout { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; padding: 6px; border: 1px dashed var(--line); border-radius: 10px; margin-top: 6px; }
.orderout { counter-reset: o; background: var(--surface); }
.ochip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; font-size: 14px; text-align: left; cursor: pointer; color: var(--ink); }
.ochip:hover { border-color: var(--accent); }
.orderout .ochip::before { counter-increment: o; content: counter(o) ". "; font-family: var(--f-mono); color: var(--muted); }
.ochip.right { border-color: var(--good); background: var(--good-soft); }
.ochip.wrong { border-color: var(--bad); background: var(--bad-soft); }
.sortlist { display: grid; gap: 6px; margin-top: 6px; }
.sortrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.sortrow.right { border-color: var(--good); background: var(--good-soft); }
.sortrow.wrong { border-color: var(--bad); background: var(--bad-soft); }
.binseg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.binseg button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 10px; font: 600 12.5px var(--f-body); color: var(--muted); cursor: pointer; }
.binseg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); }
.labelgrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-top: 6px; }
.labelrow { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: center; }
.labelrow .mk { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent, #fff); display: grid; place-items: center; font: 600 12px var(--f-mono); }
.labelrow select { width: 100%; }
.pverdict { font-size: 13.5px; margin-top: 6px; padding: 7px 10px; border-radius: 8px; }
.pverdict.ok { background: var(--good-soft); color: var(--good); }
.pverdict.no { background: var(--bad-soft); color: var(--bad); }
.model { white-space: pre-wrap; margin: 4px 0 8px; }
.steps { margin: 4px 0 0; padding-left: 1.3em; }

/* diagrams (shared SVG kit) */
.figure svg .ln { stroke: var(--ink); stroke-width: 2; fill: none; }
.figure svg .bx { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.figure svg .soft { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.figure svg .red { fill: #f6d4d0; stroke: #b0362b; stroke-width: 2; }
.figure svg .blue { fill: #d6e2fb; stroke: #2a4fb8; stroke-width: 2; }
.figure svg .tx { fill: var(--ink); font: 13px var(--f-body); }
.figure svg .tx.sm { font-size: 11px; }
.figure svg .tx.big { font: 700 28px var(--f-display); }
.figure svg .tk { fill: var(--muted); font: 11px var(--f-mono); }
.figure svg .gd { stroke: var(--line); stroke-width: 1; }
.figure svg .ax { stroke: var(--ink); stroke-width: 1.5; }
.figure svg .sr { fill: none; stroke-width: 2.6; stroke-linejoin: round; }
.figure svg .sr0, .figure svg .dot0 { stroke: var(--accent); } .figure svg .dot0 { fill: var(--accent); }
.figure svg .sr1, .figure svg .dot1 { stroke: #d2691e; } .figure svg .dot1 { fill: #d2691e; }
.figure svg .sl0 { fill: var(--accent); font-weight: 600; } .figure svg .sl1 { fill: #d2691e; font-weight: 600; }
.figure svg .dash { stroke-dasharray: 7 5; }
.figure svg .ar line { stroke: var(--accent); stroke-width: 2.6; } .figure svg .ar path { fill: var(--accent); }
.figure svg .mkr circle { fill: var(--accent); } .figure svg .mkr text { fill: var(--on-accent, #fff); font: 600 12px var(--f-mono); }
.figure svg .nuc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.figure svg .shell { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.figure svg .el { fill: var(--ink); }

/* notes */
.note .unit-intro { font-size: 13.5px; color: var(--muted); margin: 0 0 8px; }
.subnote-fig { margin-top: 10px; }

/* games */
.game-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.gscore { font: 700 15px var(--f-mono); }
.scenario { font-size: 16px; padding: 12px 14px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 8px; margin-bottom: 12px; }
.options.graphs.four { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.options.graphs .opt .figure { margin: 0; padding: 4px; border: 0; background: none; width: 100%; }
.mcell .figure { margin: 0; padding: 2px; border: 0; background: none; }
.mcell .figure svg { max-height: 110px; width: auto; }
.match.elements { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.mcell.big { font: 700 18px var(--f-display); text-align: center; }
.mcell sup, .mcell sub { font-size: 70%; }

@media (max-width: 600px) { .labelgrid { grid-template-columns: 1fr; } .sortrow { grid-template-columns: 1fr; } }

/* command terms dialog */
dialog.terms-dlg { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 0; width: min(760px, 94vw); max-height: 86vh; }
dialog.terms-dlg::backdrop { background: rgba(10, 16, 28, .5); }
dialog.terms-dlg #termsBody { max-height: 70vh; overflow: auto; }

/* Periodic Table (Y9 chemistry): header button in Year 9, a button on every Y9 chemistry question, and the Notes */
:root:not([data-year="9"]) #ptBtn { display: none; }
#ptBtn svg rect { fill: none; stroke: currentColor; stroke-width: 1.6; }
.qmeta .pt-open { margin-left: auto; }
.pt-wrap { display: grid; gap: 10px; overflow-x: auto; }
.pt-grid { display: grid; grid-template-columns: repeat(8, minmax(62px, 1fr)); gap: 4px; min-width: 520px; }
.pt-head { text-align: center; font: 600 11px var(--f-mono); color: var(--muted); }
.pt-cell { position: relative; border: 1px solid var(--line); border-radius: 6px; padding: 16px 4px 16px; text-align: center; background: var(--surface); min-height: 72px; display: grid; align-content: center; }
.pt-empty { border: 0; background: none; }
.pt-z { position: absolute; top: 3px; left: 5px; font: 600 10.5px var(--f-mono); color: var(--muted); }
.pt-sym { font: 800 20px/1 var(--f-display); }
.pt-name { font-size: 9.5px; color: var(--muted); margin-top: 3px; }
.pt-a { position: absolute; bottom: 3px; left: 0; right: 0; font: 600 11px var(--f-mono); }
.pt-metal { background: #fdecd9; } .pt-non-metal { background: #dff3e4; } .pt-metalloid { background: #ece6fb; }
:root[data-theme="dark"] .pt-metal { background: #3a2a17; } :root[data-theme="dark"] .pt-non-metal { background: #13301f; } :root[data-theme="dark"] .pt-metalloid { background: #2a1f47; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pt-metal { background: #3a2a17; } :root:not([data-theme="light"]) .pt-non-metal { background: #13301f; } :root:not([data-theme="light"]) .pt-metalloid { background: #2a1f47; } }
.pt-key { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.pt-keycell { width: 70px; flex: none; }
.pt-sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -1px; margin-left: 8px; }
.subnote-fig .pt-wrap { margin-top: 4px; }

/* ===== Games page: one rounded panel per unit, game cards nested inside ===== */
.unit-games { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 16px 18px 6px; margin: 0 0 16px; box-shadow: var(--shadow); }
.unit-games.empty { background: none; box-shadow: none; border-style: dashed; padding-bottom: 14px; }
.unit-games.class-games { background: linear-gradient(135deg, var(--accent-soft), var(--surface) 70%); }
.unit-games .mode-cards { margin: 10px 0 12px; }
.ug-head { display: flex; align-items: center; gap: 12px; }
.ug-head h3 { margin: 0; font-size: 1.15rem; }
.ug-head .pill { margin-left: auto; }
.ug-em { font-size: 28px; line-height: 1; }
.ug-n { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.ug-soon { margin: 8px 0 0; }
.game-done h3 { margin-bottom: 6px; }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.chip.right, .chip.wrong { opacity: 1; }
.chip.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.chip.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }

/* Build-an-Atom */
.ba-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 320px); gap: 16px; align-items: start; }
.ba-grid .figure { min-height: 240px; display: grid; place-items: center; }
.ba-ctrs { display: grid; gap: 8px; }
.ba-ctr { display: grid; grid-template-columns: 1fr auto 3ch auto 20px; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.ba-l { font-weight: 600; }
.ba-v { text-align: center; font: 700 20px var(--f-mono); }
.ba-mark.ok { color: var(--good); font-weight: 700; } .ba-mark.no { color: var(--bad); font-weight: 700; }

/* Periodic Mystery */
.pm-wrap { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
.pm-clues ol { padding-left: 1.2em; margin: 0 0 10px; } .pm-clues li { margin: 4px 0; }
.pm-grid { display: grid; grid-template-columns: repeat(8, minmax(40px, 1fr)); gap: 4px; }
.pm-cell { position: relative; border: 1px solid var(--line); border-radius: 6px; min-height: 54px; display: grid; place-items: center; font: inherit; cursor: pointer; padding: 12px 2px; }
.pm-cell b { font: 800 17px var(--f-display); }
.pm-cell .pt-a { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 10px; }
.pm-cell:hover:not(:disabled) { border-color: var(--accent); }
.pm-cell.wrong { opacity: .35; text-decoration: line-through; }
.pm-cell.right { outline: 3px solid var(--good); }
.pm-empty { border: 0; background: none; cursor: default; }

/* Free-Body Builder */
.fb-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 380px); gap: 16px; align-items: start; }
.fb-palette, .fb-res { display: flex; flex-wrap: wrap; gap: 6px; }
.fb-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.fb-slot { display: grid; gap: 2px; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font: inherit; cursor: pointer; }
.fb-slot:hover:not(:disabled) { border-color: var(--accent); }
.fb-slot.right { border-color: var(--good); background: var(--good-soft); } .fb-slot.wrong { border-color: var(--bad); background: var(--bad-soft); }

/* Stop in Time */
.st-track { position: relative; height: 74px; margin: 14px 0; border-radius: 12px; background: repeating-linear-gradient(90deg, transparent 0 28px, rgba(255,255,255,.55) 28px 44px) center / 100% 4px no-repeat, #59626f; overflow: hidden; }
.st-car, .st-obst, .st-boom { position: absolute; top: 18px; font-size: 32px; line-height: 1; transform: translateX(-50%); }
.st-car { left: 3%; }
.st-car.go { animation: stDrive 2.6s cubic-bezier(.15, .55, .35, 1) forwards; }
@keyframes stDrive { from { left: 3%; } to { left: var(--to); } }
.st-boom { animation: stBoom .4s 2.3s both; z-index: 2; }
@keyframes stBoom { from { opacity: 0; transform: translateX(-50%) scale(.3); } to { opacity: 1; transform: translateX(-50%) scale(1.2); } }
.st-mark { position: absolute; top: 6px; bottom: 6px; width: 2px; background: #fbbf24; }
.st-gap { position: absolute; right: 8px; bottom: 4px; color: #e5e7eb !important; }
.st-form { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; }
.st-form .field { display: grid; gap: 4px; }

/* suvat Sprint */
.sv-known { margin: 6px 0 8px; padding-left: 1.2em; }

@media (max-width: 760px) { .ba-grid, .pm-wrap, .fb-grid { grid-template-columns: 1fr; } .pm-grid { grid-template-columns: repeat(8, minmax(32px, 1fr)); } .pm-cell b { font-size: 14px; } }
@media (prefers-reduced-motion: reduce) { .st-car.go { animation-duration: .01s; } .st-boom { animation-delay: 0s; } }

<script>
/* ---- core.js ---- */
/* Core helpers shared by the content files, the engine and the tests. */
function makeR(seed) {
  let a = seed >>> 0;
  const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const R = {
    f, int: (lo, hi) => lo + Math.floor(f() * (hi - lo + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    shuffle: (arr) => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; },
    sample: (arr, n) => R.shuffle(arr).slice(0, n),
    step: (lo, hi, st) => { const n = Math.round((hi - lo) / st); return +(lo + st * R.int(0, n)).toFixed(6); },
    chance: (p) => f() < p
  };
  return R;
}
const NUM = (() => {
  const sci = (x, n = 3) => { const e = Math.floor(Math.log10(Math.abs(x))); const m = +(x / 10 ** e).toPrecision(n); return `${m} × 10<sup>${e}</sup>`; };
  const sf = (x, n = 3) => { if (!isFinite(x)) return String(x); if (x === 0) return '0'; const v = +x.toPrecision(n); return Math.abs(v) >= 1e6 || Math.abs(v) < 1e-3 ? sci(v, n) : String(v); };
  const dp = (x, n = 1) => String(+(+x).toFixed(n));
  return { sf, sci, dp };
})();

/* ---- meta.js ---- */
/* Years, units, strand descriptors and command terms. Content for each live unit is in content/*.js */
const DECKS = {
  9: 'https://docs.google.com/presentation/d/1Nj9uLi0rYCpOGP2LWmWq3ttlrKKcn0HAfOCB2bcb_jY/edit',
  10: 'https://docs.google.com/presentation/d/1tpP6EDYeiI32MYfDyZO5hkqy3uw3jDj7GW5ZFgPoLts/edit',
  11: 'https://docs.google.com/presentation/d/1A2CdWQwCofvc415T3R51j_dGVARjeVs7bL_Gaps-2pg/edit'
};
const YEARS = [
  { y: 9, myp: 3, label: 'Year 9', note: 'MYP 3' },
  { y: 10, myp: 4, label: 'Year 10', note: 'MYP 4' },
  { y: 11, myp: 5, label: 'Year 11', note: 'MYP 5' }
];
// units in teaching order; `live` units have content in content/*.js
const UNIT_LIST = [

    soi: 'The relationship between lifestyle choices and the function of the immune system is linked to health consequences.' },

  { id: 'y9-phy', y: 9, n: 4, subject: 'Physics', em: '⚡', title: 'Electrical Energy', live: false,
    soi: 'Changes in electrical energy transformations allow for innovative advances in technology but come with the need to balance risks and responsibilities.' },
  { id: 'y10-ess', y: 10, n: 1, subject: 'ESS', em: '🦌', title: 'Population & Conservation', live: false,
    soi: 'Evidence of population change guides conservation.' },
  { id: 'y10-che', y: 10, n: 2, subject: 'Chemistry', em: '🧂', title: 'Solution Chemistry', live: false,
    soi: 'Bonding explains the physical and chemical behaviour of particles in solution.' },

    soi: 'The coordinated functions of organs interact as systems that contribute to the health and well-being of an organism.' },
  { id: 'y11-phy', y: 11, n: 2, subject: 'Physics', em: '🚗', title: 'Forces & Motion', live: true,

    soi: 'Chemical change resulting from the transformation of fuels leads to predictable consequences.' },
  { id: 'y11-bio', y: 11, n: 4, subject: 'Biology', em: '🧪', title: 'Digestion & Metabolism', live: false,
    soi: 'Evidence of change derived from molecular interactions within the body provides guidance for decisions in human health.' }
];
const STRANDS = [
  { id: 'i', label: 'A i', name: 'Knowing', blurb: 'Recall, state, outline, describe and explain scientific knowledge.' },
  { id: 'ii', label: 'A ii', name: 'Applying', blurb: 'Use your knowledge to solve problems in familiar and unfamiliar situations.' },
  { id: 'iii', label: 'A iii', name: 'Analysing', blurb: 'Interpret, analyse and evaluate data and claims to make scientifically supported judgments.' }
];
const BANDS = [2, 4, 6, 8];
const BAND_LABEL = { 2: '1–2', 4: '3–4', 6: '5–6', 8: '7–8' };
// level descriptors, worded as on the Criterion A tests for each year
const DESC5 = {
  i: { 2: 'State scientific knowledge', 4: 'Outline scientific knowledge', 6: 'Describe scientific knowledge', 8: 'Explain scientific knowledge' },
  ii: { 2: 'Apply scientific knowledge and understanding to suggest solutions to problems set in familiar situations', 4: 'Apply scientific knowledge and understanding to solve problems set in familiar situations', 6: 'Apply scientific knowledge and understanding to solve problems set in familiar situations and suggest solutions to problems set in unfamiliar situations', 8: 'Apply scientific knowledge and understanding to solve problems set in familiar and unfamiliar situations' },
  iii: { 2: 'Interpret information to make judgments', 4: 'Interpret information to make scientifically supported judgments', 6: 'Analyse information to make scientifically supported judgments', 8: 'Analyse and evaluate information to make scientifically supported judgments' }
};
const DESC3 = {
  i: { 2: 'Recall scientific knowledge', 4: 'State scientific knowledge', 6: 'Outline scientific knowledge', 8: 'Describe scientific knowledge' },
  ii: DESC5.ii,
  iii: { 2: 'Apply information to make judgments', 4: 'Apply information to make scientifically supported judgments', 6: 'Interpret information to make scientifically supported judgments', 8: 'Analyse information to make scientifically supported judgments' }
};
const descFor = (y, s, b) => (y === 9 ? DESC3 : DESC5)[s][b];
// command terms as printed on the Criterion A tests and exams
const COMMAND_TERMS = [
  ['Analyse', 'Break down in order to bring out the essential elements or structure. (To identify parts and relationships, and to interpret information to reach conclusions.)'],
  ['Apply', 'Use knowledge and understanding in response to a given situation or real circumstances.'],
  ['Calculate', 'Obtain a numerical answer showing the relevant stages in the working.'],
  ['Compare & contrast', 'Give an account of similarities and differences between two (or more) items or situations, referring to both (all) of them throughout.'],
  ['Deduce', 'Reach a conclusion from the information given.'],
  ['Define', 'Give the precise meaning of a word, phrase, concept or physical quantity.'],
  ['Describe', 'Give a detailed account.'],
  ['Evaluate', 'Make an appraisal by weighing up the strengths and limitations.'],
  ['Explain', 'Give a detailed account including reasons or causes.'],
  ['Identify', 'Provide an answer from a number of possibilities. Recognize and state briefly a distinguishing fact or feature.'],
  ['Interpret', 'Use knowledge and understanding to recognize trends and draw conclusions from given information.'],
  ['Label', 'Add title, labels or brief explanation(s) to a diagram or graph.'],
  ['Outline', 'Give a brief account or summary.'],
  ['Present', 'Offer for display, observation, examination or consideration.'],
  ['Show', 'Give the steps in a calculation or derivation.'],
  ['Sketch', 'Represent by means of a diagram or graph (labelled as appropriate). The sketch should give a general idea of the required shape or relationship, and should include relevant features.'],
  ['Solve', 'Obtain the answer(s) using appropriate methods.'],
  ['State', 'Give a specific name, value or other brief answer without explanation or calculation.'],
  ['Suggest', 'Propose a solution, hypothesis or other possible answer.']
];
const CONTENT = {}; // filled by content/*.js: CONTENT[unitId] = { flow, notes, cards, qs }

/* Helpers for writing questions. A question template is
   { id, s: 'i'|'ii'|'iii', b: 2|4|6|8, topic, gen(R) -> instance }
   instance types: mcq {choices, ans}, num {ans, unit, tol|tolAbs, steps}, text {accept, mode}, select {options, ans},
   order {items (correct order)}, sort {bins, items:[[text, bin]]}, label {labels, options, fig},
   self {model, check:[points]}, parts {parts:[…]} */
const H = {
  table(head, rows, cap) {
    return `<div class="tablewrap"><table class="data">${cap ? `<caption class="small">${cap}</caption>` : ''}<thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  },
  // "Which term matches this definition?" from a unit's recall cards
  termMCQ(cards, R) {
    const pick = R.sample(cards, 4), c = pick[0];
    return { type: 'mcq', stem: `<p>Which term matches this definition?</p><p><i>${c[1]}</i></p>`, choices: pick.map(x => x[0]), ans: 0, why: `<p><b>${c[0]}</b>: ${c[1]}</p>` };
  },
  // "Which statement best defines X?"
  defMCQ(cards, R) {
    const pick = R.sample(cards, 4), c = pick[0];
    return { type: 'mcq', stem: `<p>Which statement best describes <b>${c[0]}</b>?</p>`, choices: pick.map(x => x[1]), ans: 0, why: `<p><b>${c[0]}</b>: ${c[1]}</p>` };
  },
  // fact bank entries: [question, correct, wrong, wrong, wrong, why]
  factMCQ(bank, R) {
    const f = R.pick(bank);
    return { type: 'mcq', stem: `<p>${f[0]}</p>`, choices: f.slice(1, 5), ans: 0, why: f[5] ? `<p>${f[5]}</p>` : '' };
  },
  // a fact bank split into one template per subtopic: rows are [sub, question, correct, wrong, wrong, wrong, why]
  bank(prefix, s, b, topic, rows) {
    return [...new Set(rows.map(r => r[0]))].map(sub => ({ id: `${prefix}-${sub}`, s, b, sub, topic, gen: (R) => { const f = R.pick(rows.filter(r => r[0] === sub)); return { type: 'mcq', stem: `<p>${f[1]}</p>`, choices: f.slice(2, 6), ans: 0, why: f[6] ? `<p>${f[6]}</p>` : '' }; } }));
  },
  // self-marked extended answer
  self(stem, model, check, extra = {}) { return { type: 'self', stem, model, check, ...extra }; }
};

/* Elements 1–20 with atomic masses rounded to whole numbers. This is the simplified Periodic Table students use,
   and every chemistry question takes its values from here. [symbol, name, Z, atomic mass (whole number), group, period, type, usual ion charge] */
const ELEMENTS20 = [
  ['H', 'hydrogen', 1, 1, 1, 1, 'non-metal', 1], ['He', 'helium', 2, 4, 18, 1, 'non-metal', null], ['Li', 'lithium', 3, 7, 1, 2, 'metal', 1], ['Be', 'beryllium', 4, 9, 2, 2, 'metal', 2],
  ['B', 'boron', 5, 11, 13, 2, 'metalloid', null], ['C', 'carbon', 6, 12, 14, 2, 'non-metal', null], ['N', 'nitrogen', 7, 14, 15, 2, 'non-metal', -3], ['O', 'oxygen', 8, 16, 16, 2, 'non-metal', -2],
  ['F', 'fluorine', 9, 19, 17, 2, 'non-metal', -1], ['Ne', 'neon', 10, 20, 18, 2, 'non-metal', null], ['Na', 'sodium', 11, 23, 1, 3, 'metal', 1], ['Mg', 'magnesium', 12, 24, 2, 3, 'metal', 2],
  ['Al', 'aluminium', 13, 27, 13, 3, 'metal', 3], ['Si', 'silicon', 14, 28, 14, 3, 'metalloid', null], ['P', 'phosphorus', 15, 31, 15, 3, 'non-metal', -3], ['S', 'sulfur', 16, 32, 16, 3, 'non-metal', -2],
  ['Cl', 'chlorine', 17, 35, 17, 3, 'non-metal', -1], ['Ar', 'argon', 18, 40, 18, 3, 'non-metal', null], ['K', 'potassium', 19, 39, 1, 4, 'metal', 1], ['Ca', 'calcium', 20, 40, 2, 4, 'metal', 2]
].map(e => ({ sym: e[0], name: e[1], Z: e[2], A: e[3], grp: e[4], per: e[5], type: e[6], ion: e[7] }));
function periodicTableHTML() {
  const cols = [1, 2, 13, 14, 15, 16, 17, 18];
  const cell = (e) => e ? `<div class="pt-cell pt-${e.type}" title="${e.name}: atomic number ${e.Z}, atomic mass ${e.A}"><span class="pt-z">${e.Z}</span><span class="pt-sym">${e.sym}</span><span class="pt-name">${e.name}</span><span class="pt-a">${e.A}</span></div>` : '<div class="pt-cell pt-empty"></div>';
  let h = '<div class="pt-wrap"><div class="pt-grid">' + cols.map(g => `<div class="pt-head">${g}</div>`).join('');
  for (let p = 1; p <= 4; p++) h += cols.map(g => cell(ELEMENTS20.find(e => e.per === p && e.grp === g))).join('');
  h += '</div><div class="pt-key"><div class="pt-cell pt-keycell"><span class="pt-z">Z</span><span class="pt-sym">X</span><span class="pt-name">name</span><span class="pt-a">mass</span></div><div class="small">Top: <b>atomic number</b> (protons). Bottom: <b>atomic mass</b>, rounded to a whole number. Rows are periods 1–4; column headings are groups.<br><span class="pt-sw pt-metal"></span> metal <span class="pt-sw pt-non-metal"></span> non-metal <span class="pt-sw pt-metalloid"></span> metalloid</div></div></div>';
  return h;
}

/* ---- svg.js ---- */
/* Small SVG drawing kit used by the content files. Colours come from CSS classes so diagrams follow light/dark mode. */
const SVG = (() => {
  const f = (n) => +(+n).toFixed(2);
  const svg = (w, h, inner, label = 'Diagram') => `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  const line = (x1, y1, x2, y2, cls = 'ln', extra = '') => `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" class="${cls}" ${extra}/>`;
  // SVG text cannot hold HTML: turn <sup>/<sub> into shifted tspans
  const sv = (t) => String(t).replace(/<sup>(.*?)<\/sup>/g, '<tspan dy="-5" font-size="9">$1</tspan><tspan dy="5"> </tspan>').replace(/<sub>(.*?)<\/sub>/g, '<tspan dy="3" font-size="9">$1</tspan><tspan dy="-3"> </tspan>');
  const text = (x, y, t, cls = 'tx', anchor = 'middle', extra = '') => `<text x="${f(x)}" y="${f(y)}" class="${cls}" text-anchor="${anchor}" ${extra}>${sv(t)}</text>`;
  const rect = (x, y, w, h, cls = 'bx', rx = 6) => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${rx}" class="${cls}"/>`;
  const circle = (x, y, r, cls = 'bx') => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" class="${cls}"/>`;
  const path = (d, cls = 'ln') => `<path d="${d}" class="${cls}"/>`;
  // numbered marker used in label questions
  const mk = (x, y, n) => `<g class="mkr"><circle cx="${f(x)}" cy="${f(y)}" r="11"/><text x="${f(x)}" y="${f(y + 4)}" text-anchor="middle">${n}</text></g>`;
  function arrow(x1, y1, x2, y2, cls = 'ar', head = 9) {
    const a = Math.atan2(y2 - y1, x2 - x1), h1 = a + Math.PI * 0.85, h2 = a - Math.PI * 0.85;
    return `<g class="${cls}"><line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"/><path d="M${f(x2)} ${f(y2)} L${f(x2 + head * Math.cos(h1))} ${f(y2 + head * Math.sin(h1))} L${f(x2 + head * Math.cos(h2))} ${f(y2 + head * Math.sin(h2))} Z"/></g>`;
  }
  // line graph with labelled axes and gridlines
  function graph(o) {
    const W = o.w || 460, H = o.h || 300, L = 62, R = 18, T = 16, B = 50;
    const pw = W - L - R, ph = H - T - B;
    const X = (x) => L + (x - o.xmin) / (o.xmax - o.xmin) * pw, Y = (y) => T + ph - (y - o.ymin) / (o.ymax - o.ymin) * ph;
    let g = '';
    for (let x = o.xmin; x <= o.xmax + 1e-9; x += o.xstep) g += line(X(x), T, X(x), T + ph, 'gd') + text(X(x), T + ph + 18, fmtTick(x), 'tk');
    for (let y = o.ymin; y <= o.ymax + 1e-9; y += o.ystep) g += line(L, Y(y), L + pw, Y(y), 'gd') + text(L - 8, Y(y) + 4, fmtTick(y), 'tk', 'end');
    g += line(L, T + ph, L + pw, T + ph, 'ax') + line(L, T, L, T + ph, 'ax');
    if (o.ymin < 0 && o.ymax > 0) g += line(L, Y(0), L + pw, Y(0), 'ax');
    g += text(L + pw / 2, H - 8, o.xlabel, 'tx');
    g += `<text class="tx" text-anchor="middle" transform="translate(16 ${f(T + ph / 2)}) rotate(-90)">${sv(o.ylabel)}</text>`;
    (o.series || []).forEach((s, i) => {
      const d = s.pts.map((p, j) => `${j ? 'L' : 'M'}${f(X(p[0]))} ${f(Y(p[1]))}`).join(' ');
      if (!s.noline) g += `<path d="${d}" class="sr sr${i}${s.dash ? ' dash' : ''}"/>`;
      if (s.dots) s.pts.forEach(p => { g += `<circle cx="${f(X(p[0]))}" cy="${f(Y(p[1]))}" r="3.5" class="dot dot${i}"/>`; });
      if (s.label) { const p = s.labelAt || s.pts[s.pts.length - 1]; g += text(X(p[0]) + 6, Y(p[1]) - 6, s.label, `tx sl${i}`, 'start'); }
    });
    (o.marks || []).forEach(m => { g += mk(X(m[0]), Y(m[1]), m[2]); });
    return svg(W, H, g, o.label || 'Graph');
  }
  function fmtTick(v) { return Math.abs(v) < 1e-9 ? '0' : (+v.toFixed(3)).toString(); }
  // Bohr diagram for an atom or ion: shells 2, 8, 8, 2 (elements 1–20)
  function bohr(sym, Z, N, charge = 0, opts = {}) {
    const e = Z - charge, shells = [], cap = [2, 8, 8, 8]; let left = e;
    for (let i = 0; i < 4 && left > 0; i++) { const k = Math.min(cap[i], left); shells.push(k); left -= k; }
    const n = shells.length, R0 = 30, step = 26, S = 2 * (R0 + step * n) + 30, c = S / 2;
    let g = circle(c, c, R0 - 6, 'nuc') + (opts.hideNucleus ? text(c, c + 5, '?', 'tx') : text(c, c - 2, `${Z}p`, 'tx sm') + text(c, c + 12, `${N}n`, 'tx sm'));
    shells.forEach((k, i) => {
      const r = R0 + step * (i + 0.5);
      g += circle(c, c, r, 'shell');
      for (let j = 0; j < k; j++) {
        const ang = -Math.PI / 2 + (i === 0 ? j * Math.PI : (Math.floor(j / 2) * Math.PI / 2 + (j % 2 ? 0.28 : -0.28)));
        g += circle(c + r * Math.cos(ang), c + r * Math.sin(ang), 4.2, 'el');
      }
    });
    if (charge) g = `<text x="${S - 6}" y="16" class="tx" text-anchor="end">${charge > 0 ? (charge > 1 ? charge : '') + '+' : (charge < -1 ? -charge : '') + '−'}</text>` + g;
    return svg(S, S, g, `Bohr diagram of ${sym}`);
  }
  // Lewis (electron dot) symbol for an atom with v valence electrons
  function lewis(sym, v) {
    // fill singly top, right, bottom, left, then pair up (Hund-style, as taught)
    const S = 110, c = S / 2, pos = [[0, -26], [26, 0], [0, 26], [-26, 0]], along = [[1, 0], [0, 1], [1, 0], [0, 1]];
    const k = [0, 0, 0, 0]; for (let i = 0; i < v; i++) k[i % 4]++;
    let g = text(c, c + 9, sym, 'tx big');
    k.forEach((n, side) => {
      const [px, py] = pos[side], [ax, ay] = along[side];
      if (n === 1) g += circle(c + px, c + py, 3.6, 'el');
      if (n === 2) g += circle(c + px - ax * 6, c + py - ay * 6, 3.6, 'el') + circle(c + px + ax * 6, c + py + ay * 6, 3.6, 'el');

    return svg(S, S, g, `Lewis symbol of ${sym}`);
  }
  // free-body diagram: forces = [{dir:'up'|'down'|'left'|'right', label}]
  function fbd(forces, w = 340, h = 280, body = 'box') {

    forces.forEach(F => {
      const [dx, dy] = L[F.dir], len = F.len || 80, sx = cx + dx * (dx ? bw / 2 : 0), sy = cy + dy * (dy ? bh / 2 : 0);
      g += arrow(sx, sy, sx + dx * len, sy + dy * len, 'ar');
      const tx = sx + dx * (len + (dx ? 12 : 0)) + (dy ? 14 : 0), ty = sy + dy * (len + (dy ? 14 : 0)) + (dx ? -8 : 4);
      g += text(tx, ty, F.label, 'tx', dx < 0 ? 'end' : 'start');
    });
    return svg(w, h, g, 'Free-body diagram');
  }
  return { svg, line, text, rect, circle, path, mk, arrow, graph, bohr, lewis, fbd };
})();

/* Unit games. Each game: { id, y, uid, name, icon, desc, start(R), render(G, h), click(G, button) → truthy to redraw ({ wrong } to shake),
   result(G, prev) → best record, better(res, prev), bestText(best) }. The engine stores one best record per game. */
const GAMES = (() => {
  const fmt = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '+': '⁺', '−': '⁻' };
  const sup = (t) => String(t).split('').map(c => SUP[c] || c).join('');
  const ionStr = (q) => q === 0 ? '' : `${Math.abs(q) > 1 ? Math.abs(q) : ''}${q > 0 ? '+' : '−'}`;

  /* ---------- Element Match (Year 9 Chemistry of Industry) ---------- */
  const VARIANTS = [
    ['symbols', '🔤 Names & Symbols', 'Match each element name to its symbol.'],
    ['bohr', '⚛️ Bohr Models', 'Match each Bohr diagram to its element.'],
    ['ions', '⚡ Ions', 'Match each ion to its protons and electrons.'],
    ['isotopes', '🧪 Isotopes', 'Match each isotope to its protons, neutrons and electrons.'],
    ['mixed', '🎲 Mixed', 'A bit of everything.']
  ];
  function elPairs(R, variant) {
    const { EL } = CONTENT['y9-che'].data;
    const pick = (list, n) => R.sample(list, n);
    const make = {
      symbols: (e) => ({ key: 's' + e.sym, L: e.name[0].toUpperCase() + e.name.slice(1), Rt: `<span class="mcell-big">${e.sym}</span>` }),
      bohr: (e) => ({ key: 'b' + e.sym, L: `<div class="figure">${SVG.bohr(e.sym, e.Z, e.A - e.Z, 0, { hideNucleus: true })}</div>`, Rt: e.name[0].toUpperCase() + e.name.slice(1) }),
      ions: (e) => ({ key: 'i' + e.sym, L: `<span class="mcell-big">${e.sym}${sup(ionStr(e.ion))}</span>`, Rt: `${e.Z} protons, ${e.Z - e.ion} electrons` }),
      isotopes: (e, R) => { const A = e.A + R.pick([0, 1, 2]); return { key: 'o' + e.sym + A, L: `<span class="mcell-big">${sup(String(A))}${e.sym}</span>`, Rt: `${e.Z} p, ${A - e.Z} n, ${e.Z} e` }; }
    };
    const pools = { symbols: EL, bohr: EL.filter(e => e.Z >= 3), ions: EL.filter(e => e.ion !== null && e.Z > 2), isotopes: EL.filter(e => e.Z > 1) };

  const fbNew = (R, used) => { const sc = R.pick(FB_SC.filter(x => !used.includes(x.t))); return { sc, slots: { up: null, down: null, left: null, right: null }, res: null, sel: null, checked: false, ok: null }; };
  const freeBody = {
    id: 'y11-free-body', y: 11, uid: 'y11-phy', icon: '🧱', name: 'Free-Body Builder',

    start: (R) => { const G = { R, i: 0, score: 0, t0: Date.now(), pen: 0, end: null, used: [] }; G.rd = fbNew(R, G.used); G.used.push(G.rd.sc.t); return G; },

  /* ---------- Stop in Time (Year 11 Forces & Motion) ---------- */
  const ST_ROUNDS = 6;

  function stNew(R) {
    const kmh = R.pick([36, 54, 72, 90, 108]), dr = R.pick(ST_DRIVER), rd = R.pick(ST_ROAD), v = kmh / 3.6;

    const gap = Math.max(8, Math.round(stop * (R.chance(0.5) ? R.step(1.08, 1.35, 0.01) : R.step(0.7, 0.92, 0.01))));

        <div class="scenario">A car is travelling at <b>${r.kmh} km h<sup>−1</sup></b>. The driver is <b>${r.dr[0]}</b> (reaction time <b>${r.dr[1]} s</b>) and the road is <b>${r.rd[0]}</b> (braking deceleration <b>${r.rd[1]} m s<sup>−2</sup></b>). A child steps into the road <b>${r.gap} m</b> ahead.</div>

  /* ---------- suvat Sprint (Year 11 Forces & Motion) ---------- */

  function svNew(R) {

    const val = { u, a, t, v: u + a * t, s: u * t + 0.5 * a * t * t };
    let miss, want; do { miss = R.pick(['t', 's', 'v', 'a']); want = R.pick(['s', 'u', 'v', 'a', 't'].filter(k => k !== miss)); } while (miss === 'v' && want === 't');

  /* ======================= QUESTION TYPES ======================= */

  // score one auto-marked item, 0..1

  // shared event handling for an answer area

  function answerInput(e, st) {

  /* Class codes: everyone who enters the same code gets the same questions in the same order.

  /* ---------- Last Man Standing sound: synthesised with Web Audio (no files), as in MVPhysics Lab ---------- */

        <div class="tile"><span class="k">Subtopics</span><span class="v num">${ALL_SUBS.length}</span><span class="s">one per lesson topic</span></div>
        <div class="tile"><span class="k">Recall cards</span><span class="v num">${CARDS.length}</span><span class="s">including ${COMMAND_TERMS.length} command terms</span></div>
      </div>
      <section class="panel"><h3>How the Questions Are Made</h3><ul class="about-list">
        <li><b>From the class notes.</b> Units, subtopics and their order follow Mr. Poirier's Science Notes slides and the unit descriptions. Unit tests and test banks were used only as models for style and difficulty. No question is copied.</li>
        <li><b>Criterion A strands and levels.</b> Every question is written for one strand (A i knowing, A ii applying, A iii analysing) and one level band (1–2, 3–4, 5–6, 7–8), using the level descriptors on your tests.</li>
        <li><b>Templates, not fixed questions.</b> Most questions choose realistic values each time and work out the answer and worked solution from them. Use New Values to try again.</li>
        <li><b>Marking.</b> Choices, numbers, labels and orders are marked automatically. Describe, explain, analyse and evaluate answers are self-marked against a model answer and a markscheme checklist.</li>
      </ul></section>
      <section class="panel"><h3>The Question Bank</h3><div class="tbl-wrap"><table class="stats"><thead><tr><th>Unit</th><th>Subtopics</th>${STRANDS.map(s => `<th>${s.label}</th>`).join('')}<th>Total</th><th>Cards</th></tr></thead><tbody>${rows}</tbody></table></div></section>
      <section class="panel"><h3>Quality Checks</h3><ul class="about-list"><li>Every question type is generated with hundreds of values and checked for missing values, broken answers, duplicate options and impossible labels.</li><li>Every question is played in a browser with the correct answer and must score 100%, on desktop and phone sizes, in light and dark mode.</li></ul></section>
      <section class="panel"><h3>Privacy</h3><p>Nothing you do leaves your browser. Progress, recall schedules and settings are stored on this device only; use Stats → Backup to move them to another device.</p></section>
      <section class="panel"><h3>Revision History</h3><ol class="history">${HISTORY.slice().reverse().map(h => `<li><div class="hv"><span class="ver">v${h.v}</span><span class="muted small">${h.d}</span></div><ul>${h.items.map(i => `<li>${i}</li>`).join('')}</ul></li>`).join('')}</ol>
        <p class="muted small">Version ${VERSION} · Built ${BUILT}.</p></section>`;
  }
  function bindAbout(main) { main.onclick = null; }

  /* ======================= ROUTER ======================= */
  const VIEWS = {
    practice: [renderPractice, bindPractice, 'Practice 🎯'], games: [renderGames, bindGames, 'Games 🕹️'], recall: [renderRecall, bindRecall, 'Recall 🧠'],
    notes: [renderNotes, bindNotes, 'Notes 📓'], stats: [renderStats, bindStats, 'Stats 📈'],
    about: [renderAbout, bindAbout, 'About', true], welcome: [renderWelcome, bindWelcome, 'Welcome', true],
  };
  function currentView() { const h = (location.hash || '').slice(1); return VIEWS[h] ? h : 'welcome'; }
  function render() {
    const v = currentView(), main = $('#main');
    if (v !== 'games') stopGA();
    lmsTheme();
    if (v !== 'recall' && GM && GM.mode === 'match') stopGM();
    $$('#tabs a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + v ? 'page' : 'false'));
    const noRail = v === 'stats' || v === 'about' || v === 'welcome' || (v === 'games' && !(GA && (GA.id === 'blitz' || GA.id === 'lms') && GA.phase === 'setup'));
    $('.shell').classList.toggle('no-rail', noRail);
    if (!noRail) renderRail();
    main.onclick = null; main.onchange = null; main.oninput = null; main.onkeydown = null;
    VIEWS[v][0](main); VIEWS[v][1](main);
  }
  /* ---------- theme and year ---------- */
  const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => (S.settings.theme || (darkMQ.matches ? 'dark' : 'light')) === 'dark';
  const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.3 8.3 0 0 1 9.4 3.8a8.3 8.3 0 1 0 10.8 10.8z"/></svg>';
  function applyTheme() {
    if (S.settings.theme) document.documentElement.setAttribute('data-theme', S.settings.theme); else document.documentElement.removeAttribute('data-theme');
    const b = $('#themeBtn'); const dark = isDark();
    b.innerHTML = dark ? SUN : MOON; b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode'); b.dataset.tip = dark ? 'Light mode' : 'Dark mode';
  }
  function applyYear() { document.documentElement.dataset.year = String(Y()); $$('#yearSeg [data-year]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.year === Y()))); }
  function openPT() {
    const d = $('#termsDlg'); $('#termsTitle').textContent = 'Periodic Table (elements 1–20)'; $('#termsBody').innerHTML = periodicTableHTML();
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  }
  document.addEventListener('click', (e) => { if (e.target.closest('[data-pt]')) { e.preventDefault(); openPT(); } });
  function openTerms() {
    const d = $('#termsDlg'); $('#termsTitle').textContent = 'Command Terms'; $('#termsBody').innerHTML = `<p class="small">The command terms used on your Criterion A tests and exams.</p><table class="cmdtbl"><tbody>${COMMAND_TERMS.map(([t, x]) => `<tr><th>${t}</th><td>${x}</td></tr>`).join('')}</tbody></table>`;
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  }
  function init() {
    $('#yearSeg').innerHTML = YEARS.map(y => `<button type="button" data-year="${y.y}" aria-pressed="false" data-tip="${y.label} · ${y.note}">Y${y.y}</button>`).join('');
    $('#yearSeg').addEventListener('click', (e) => {
      const b = e.target.closest('[data-year]'); if (!b || +b.dataset.year === Y()) return;
      S.settings.year = +b.dataset.year; save(); applyYear(); P.q = null; RC = null; stopGM(); GA = null; stopGA();
      toast(`Year ${Y()} (${YEARS.find(x => x.y === Y()).note}).`); render();
    });
    applyYear();
    $('#themeBtn').addEventListener('click', () => { S.settings.theme = isDark() ? 'light' : 'dark'; save(); applyTheme(); });
    darkMQ.addEventListener && darkMQ.addEventListener('change', applyTheme);
    applyTheme();
    $('#termsBtn').addEventListener('click', openTerms);
    $('#termsClose').addEventListener('click', () => $('#termsDlg').close());
    $('#tabs').innerHTML = Object.entries(VIEWS).filter(([, v]) => !v[3]).map(([k, v]) => `<a href="#${k}">${v[2]}</a>`).join('');
    const brand = $('.top .brand h1'); brand.setAttribute('role', 'link'); brand.tabIndex = 0; brand.title = 'Welcome and guide';
    const go = () => { location.hash = '#welcome'; }; brand.addEventListener('click', go); brand.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    if (window.matchMedia('(max-width: 860px)').matches) $('#rail').classList.add('collapsed');
    renderRail(); bindRail(); render();
    window.addEventListener('hashchange', () => { render(); window.scrollTo({ top: 0 }); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

  // test hooks
  window.__LAB = {
    Q, CARDS, SUB, S: () => S, render,
    force(qid, seed) { const q = QBY[qid]; S.settings.year = q.y; if (!S.settings.sel.includes(q.subKey)) S.settings.sel.push(q.subKey); S.settings.crit[q.s] = true; S.settings.band[q.b] = true; S.settings.missedOnly = false; applyYear(); if (location.hash !== '#practice') { location.hash = '#practice'; render(); } P.q = q; P.seed = seed; P.inst = buildInst(q, seed); P.st = newState(); P.t0 = now(); renderPractice($('#main')); bindPractice($('#main')); },
    cur: () => P, ga: () => GA,
  };
})();

</script>
</body>
</html>

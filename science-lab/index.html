<style>
/* MYPoirier Science Lab. Design tokens shared with MVPhysics Lab (physics-lab). */
:root {
  --paper: #f3f5f9; --surface: #ffffff; --sheet: #fbfcfe; --ink: #142036; --muted: #5b667c; --line: #d8deea;
  --accent: #2547c9; --accent-soft: #e6ecfd; --on-accent: #ffffff;
  --grid: rgba(37, 71, 201, 0.07); --grid-major: rgba(37, 71, 201, 0.15);
  --good: #13744f; --good-soft: #e1f4ea; --bad: #c0392b; --bad-soft: #fbe7e4; --warn: #8f5609; --warn-soft: #fbf0dc;
  --s1: #0f766e; --s1-soft: #ddf3f0; --s2: #2547c9; --s2-soft: #e6ecfd; --s3: #7c3aed; --s3-soft: #f1eafe;
  --shadow: 0 1px 2px rgba(20, 32, 54, 0.06), 0 6px 18px rgba(20, 32, 54, 0.06);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d121c; --surface: #151c2a; --sheet: #121927; --ink: #e5eaf4; --muted: #96a1b6; --line: #2a3447;
    --accent: #85a2ff; --accent-soft: #1d2847; --on-accent: #0d121c; --grid: rgba(133, 162, 255, 0.06); --grid-major: rgba(133, 162, 255, 0.13);
    --good: #4cc690; --good-soft: #143326; --bad: #ff7b6b; --bad-soft: #3a1c1a; --warn: #f0b552; --warn-soft: #382a12;
    --s1: #4fd1c0; --s1-soft: #10302d; --s2: #85a2ff; --s2-soft: #1d2847; --s3: #b69cff; --s3-soft: #2a1f47;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d121c; --surface: #151c2a; --sheet: #121927; --ink: #e5eaf4; --muted: #96a1b6; --line: #2a3447;
  --accent: #85a2ff; --accent-soft: #1d2847; --on-accent: #0d121c; --grid: rgba(133, 162, 255, 0.06); --grid-major: rgba(133, 162, 255, 0.13);
  --good: #4cc690; --good-soft: #143326; --bad: #ff7b6b; --bad-soft: #3a1c1a; --warn: #f0b552; --warn-soft: #382a12;
  --s1: #4fd1c0; --s1-soft: #10302d; --s2: #85a2ff; --s2-soft: #1d2847; --s3: #b69cff; --s3-soft: #2a1f47;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; margin: 0 0 .5em; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.08rem; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.small { font-size: .86rem; color: var(--muted); }
.muted { color: var(--muted); }
.hidden { display: none !important; }
sub, sup { line-height: 0; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; background: none; border: 0; padding: 0; }
.brand h1 { font-size: 1.25rem; margin: 0; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
.brand h1 b { color: var(--accent); font-weight: 900; font-stretch: 112%; }
.badge { font: 600 .66rem/1 var(--f-mono); letter-spacing: .06em; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 4px 7px; text-transform: uppercase; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
nav.tabs button:hover { color: var(--ink); }
.tools { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 5px 11px; font-weight: 600; font-size: .86rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 1rem; }
.iconbtn:hover { border-color: var(--accent); }

main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 16px; }
.hero { padding: 26px 24px; border-radius: 16px; background: linear-gradient(135deg, var(--accent-soft), var(--surface)); border: 1px solid var(--line); margin-bottom: 16px; }
.hero h2 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 600; }
.hero h2 b { color: var(--accent); font-weight: 900; }
.hero p { max-width: 70ch; margin: .3em 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.tile { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: left; display: grid; gap: 6px; align-content: start; }
button.tile:hover { border-color: var(--accent); }
.tile .em { font-size: 1.4rem; }
.tile h3 { margin: 0; }
.tile p { margin: 0; color: var(--muted); font-size: .9rem; }
.tile.soon { opacity: .55; }
.pill { display: inline-block; font: 600 .72rem/1 var(--f-body); padding: 4px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); }
.pill.s-i { background: var(--s1-soft); color: var(--s1); border-color: transparent; }
.pill.s-ii { background: var(--s2-soft); color: var(--s2); border-color: transparent; }
.pill.s-iii { background: var(--s3-soft); color: var(--s3); border-color: transparent; }
.pill.live { background: var(--good-soft); color: var(--good); border-color: transparent; }

/* practice layout */
.work { display: grid; grid-template-columns: 290px 1fr; gap: 16px; align-items: start; }
.rail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; position: sticky; top: 76px; display: grid; gap: 14px; }
.rail h4 { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; font-family: var(--f-body); }
.unitlist { display: grid; gap: 4px; }
.unitlist button { text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 7px 9px; display: flex; gap: 8px; align-items: center; }
.unitlist button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.unitlist button:disabled { opacity: .5; cursor: default; }
.unitlist .n { font: 600 .74rem var(--f-mono); color: var(--muted); }
.chooser { display: grid; gap: 4px; }
.chooser button { text-align: left; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 7px 9px; font-size: .9rem; }
.chooser button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.chooser.levels { grid-template-columns: repeat(5, 1fr); }
.chooser.levels button { text-align: center; padding: 7px 2px; font-family: var(--f-mono); font-size: .82rem; }
.toggle { display: flex; gap: 8px; align-items: center; font-size: .9rem; }

.card { background: var(--sheet); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 22px 24px; display: grid; gap: 14px; }
.qhead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qhead .desc { flex-basis: 100%; font-size: .84rem; color: var(--muted); font-style: italic; }
.stem { font-size: 1.04rem; }
.stem p { margin: 0 0 .6em; }
.figure { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow-x: auto; }
.figure svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
table.data { border-collapse: collapse; margin: 6px 0; font-size: .92rem; background: var(--surface); }
table.data th, table.data td { border: 1px solid var(--line); padding: 5px 10px; text-align: center; }
table.data th { background: var(--accent-soft); font-weight: 600; }
.tablewrap { overflow-x: auto; }

.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.choice .k { font: 600 .82rem var(--f-mono); border: 1px solid var(--line); border-radius: 6px; min-width: 24px; text-align: center; padding: 1px 0; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ansrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input.ans, select.ans { font: 1rem var(--f-mono); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
input.ans { width: 14em; max-width: 100%; }
input.ans.right, select.ans.right { border-color: var(--good); background: var(--good-soft); }
input.ans.wrong, select.ans.wrong { border-color: var(--bad); background: var(--bad-soft); }
textarea.ans { width: 100%; min-height: 120px; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.part { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 8px; }
.part:first-child { border-top: 0; padding-top: 0; }
.part .pl { font: 600 .86rem var(--f-mono); color: var(--accent); }
.orderpool, .orderout { display: flex; flex-wrap: wrap; gap: 6px; min-height: 42px; padding: 6px; border: 1px dashed var(--line); border-radius: 10px; }
.orderout { counter-reset: o; background: var(--surface); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: .92rem; }
.orderout .chip::before { counter-increment: o; content: counter(o) ". "; font-family: var(--f-mono); color: var(--muted); }
.chip.right { border-color: var(--good); background: var(--good-soft); }
.chip.wrong { border-color: var(--bad); background: var(--bad-soft); }
.sortrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.sortrow.right { border-color: var(--good); background: var(--good-soft); }
.sortrow.wrong { border-color: var(--bad); background: var(--bad-soft); }
.sortrow .seg button { font-size: .8rem; padding: 4px 9px; }
.labelrow { display: grid; grid-template-columns: 32px 1fr; gap: 8px; align-items: center; }
.labelrow .mk { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 600 .8rem var(--f-mono); }
.labelgrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.fb { border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.fb.good { background: var(--good-soft); border: 1px solid var(--good); }
.fb.bad { background: var(--bad-soft); border: 1px solid var(--bad); }
.fb.info { background: var(--accent-soft); border: 1px solid var(--accent); }
.fb b.v { font-family: var(--f-display); }
.sol { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.sol h4 { margin: 0 0 6px; font-size: .9rem; }
.sol ol, .sol ul { margin: 0; padding-left: 1.3em; }
.check { display: grid; gap: 6px; }
.check label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.model { white-space: pre-wrap; }
.tally { font: 600 .84rem var(--f-mono); color: var(--muted); }

/* recall */
.flash { min-height: 230px; display: grid; place-items: center; text-align: center; padding: 30px; cursor: pointer; }
.flash .term { font: 700 1.6rem var(--f-display); }
.flash .def { font-size: 1.08rem; max-width: 60ch; }
.decks { display: flex; flex-wrap: wrap; gap: 6px; }
.boxes { display: flex; gap: 6px; flex-wrap: wrap; }
.boxes span { font: .78rem var(--f-mono); padding: 3px 8px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); }

/* notes */
.notes h3 { margin-top: 1em; }
.notes ul { padding-left: 1.2em; margin: .3em 0; }
.notes li { margin: .2em 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
.kv dt { font-weight: 600; color: var(--muted); }
.kv dd { margin: 0; }
.terms { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
.terms dt { font-weight: 700; }
.terms dd { margin: 0; }

/* progress */
table.prog { border-collapse: collapse; width: 100%; font-size: .92rem; }
table.prog th, table.prog td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; }
table.prog td.c { text-align: center; font-family: var(--f-mono); }
.bar { height: 8px; border-radius: 4px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--accent); }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); max-width: min(760px, 94vw); padding: 0; }
dialog::backdrop { background: rgba(10, 16, 28, .5); }
dialog .dh { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
dialog .db { padding: 16px 18px; max-height: 70vh; overflow: auto; }
footer { max-width: 1240px; margin: 0 auto; padding: 0 16px 30px; color: var(--muted); font-size: .84rem; display: flex; gap: 14px; flex-wrap: wrap; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 8px; font-size: .9rem; z-index: 50; }

/* diagrams */
.figure svg .ln { stroke: var(--ink); stroke-width: 2; fill: none; }
.figure svg .bx { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.figure svg .soft { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.figure svg .red { fill: #f6d4d0; stroke: #b0362b; stroke-width: 2; }
.figure svg .blue { fill: #d6e2fb; stroke: #2a4fb8; stroke-width: 2; }
.figure svg .tx { fill: var(--ink); font: 13px var(--f-body); }
.figure svg .tx.sm { font-size: 11px; }
.figure svg .tx.big { font: 700 28px var(--f-display); }
.figure svg .tk { fill: var(--muted); font: 11px var(--f-mono); }
.figure svg .gd { stroke: var(--line); stroke-width: 1; }
.figure svg .ax { stroke: var(--ink); stroke-width: 1.5; }
.figure svg .sr { fill: none; stroke-width: 2.6; stroke-linejoin: round; }
.figure svg .sr0, .figure svg .dot0 { stroke: var(--accent); } .figure svg .dot0 { fill: var(--accent); }
.figure svg .sr1, .figure svg .dot1 { stroke: #d2691e; } .figure svg .dot1 { fill: #d2691e; }
.figure svg .sl0 { fill: var(--accent); font-weight: 600; } .figure svg .sl1 { fill: #d2691e; font-weight: 600; }
.figure svg .dash { stroke-dasharray: 7 5; }
.figure svg .ar line { stroke: var(--accent); stroke-width: 2.6; } .figure svg .ar path { fill: var(--accent); }
.figure svg .ar2 line { stroke: var(--muted); stroke-width: 2; } .figure svg .ar2 path { fill: var(--muted); }
.figure svg .mkr circle { fill: var(--accent); } .figure svg .mkr text { fill: var(--on-accent); font: 600 12px var(--f-mono); }
.figure svg .nuc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.figure svg .shell { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.figure svg .el { fill: var(--ink); }

@media (max-width: 860px) {
  .work { grid-template-columns: 1fr; }
  .rail { position: static; }
  .card { padding: 16px; }
  .top-in { gap: 8px; }
  nav.tabs { order: 3; width: 100%; }
  .terms, .kv { grid-template-columns: 1fr; }
  .terms dd { margin-bottom: 8px; }
}
@media print { .top, .rail, .btns, footer { display: none; } .work { grid-template-columns: 1fr; } }

</style>

<script>
/* ---- core.js ---- */
/* Core helpers shared by the content files, the engine and the tests. */
function makeR(seed) {
  let a = seed >>> 0;
  const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const R = {
    f, int: (lo, hi) => lo + Math.floor(f() * (hi - lo + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
    shuffle: (arr) => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; },
    sample: (arr, n) => R.shuffle(arr).slice(0, n),
    step: (lo, hi, st) => { const n = Math.round((hi - lo) / st); return +(lo + st * R.int(0, n)).toFixed(6); },
    chance: (p) => f() < p
  };
  return R;
}
const NUM = (() => {

/* Small SVG drawing kit used by the content files. Colours come from CSS classes so diagrams follow light/dark mode. */
const SVG = (() => {
  const f = (n) => +(+n).toFixed(2);
  const svg = (w, h, inner, label = 'Diagram') => `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  const line = (x1, y1, x2, y2, cls = 'ln', extra = '') => `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" class="${cls}" ${extra}/>`;
  // SVG text cannot hold HTML: turn <sup>/<sub> into shifted tspans
  const sv = (t) => String(t).replace(/<sup>(.*?)<\/sup>/g, '<tspan dy="-5" font-size="9">$1</tspan><tspan dy="5"> </tspan>').replace(/<sub>(.*?)<\/sub>/g, '<tspan dy="3" font-size="9">$1</tspan><tspan dy="-3"> </tspan>');
  const text = (x, y, t, cls = 'tx', anchor = 'middle', extra = '') => `<text x="${f(x)}" y="${f(y)}" class="${cls}" text-anchor="${anchor}" ${extra}>${sv(t)}</text>`;
  const rect = (x, y, w, h, cls = 'bx', rx = 6) => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${rx}" class="${cls}"/>`;
  const circle = (x, y, r, cls = 'bx') => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" class="${cls}"/>`;
  const path = (d, cls = 'ln') => `<path d="${d}" class="${cls}"/>`;
  // numbered marker used in label questions
  const mk = (x, y, n) => `<g class="mkr"><circle cx="${f(x)}" cy="${f(y)}" r="11"/><text x="${f(x)}" y="${f(y + 4)}" text-anchor="middle">${n}</text></g>`;
  function arrow(x1, y1, x2, y2, cls = 'ar', head = 9) {
    const a = Math.atan2(y2 - y1, x2 - x1), h1 = a + Math.PI * 0.85, h2 = a - Math.PI * 0.85;
    return `<g class="${cls}"><line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"/><path d="M${f(x2)} ${f(y2)} L${f(x2 + head * Math.cos(h1))} ${f(y2 + head * Math.sin(h1))} L${f(x2 + head * Math.cos(h2))} ${f(y2 + head * Math.sin(h2))} Z"/></g>`;
  }
  // line graph with labelled axes and gridlines
  function graph(o) {
    const W = o.w || 460, H = o.h || 300, L = 62, R = 18, T = 16, B = 50;
    const pw = W - L - R, ph = H - T - B;
    const X = (x) => L + (x - o.xmin) / (o.xmax - o.xmin) * pw, Y = (y) => T + ph - (y - o.ymin) / (o.ymax - o.ymin) * ph;
    let g = '';
    for (let x = o.xmin; x <= o.xmax + 1e-9; x += o.xstep) g += line(X(x), T, X(x), T + ph, 'gd') + text(X(x), T + ph + 18, fmtTick(x), 'tk');
    for (let y = o.ymin; y <= o.ymax + 1e-9; y += o.ystep) g += line(L, Y(y), L + pw, Y(y), 'gd') + text(L - 8, Y(y) + 4, fmtTick(y), 'tk', 'end');
    g += line(L, T + ph, L + pw, T + ph, 'ax') + line(L, T, L, T + ph, 'ax');
    if (o.ymin < 0 && o.ymax > 0) g += line(L, Y(0), L + pw, Y(0), 'ax');
    g += text(L + pw / 2, H - 8, o.xlabel, 'tx');
    g += `<text class="tx" text-anchor="middle" transform="translate(16 ${f(T + ph / 2)}) rotate(-90)">${sv(o.ylabel)}</text>`;
    (o.series || []).forEach((s, i) => {
      const d = s.pts.map((p, j) => `${j ? 'L' : 'M'}${f(X(p[0]))} ${f(Y(p[1]))}`).join(' ');
      if (!s.noline) g += `<path d="${d}" class="sr sr${i}${s.dash ? ' dash' : ''}"/>`;
      if (s.dots) s.pts.forEach(p => { g += `<circle cx="${f(X(p[0]))}" cy="${f(Y(p[1]))}" r="3.5" class="dot dot${i}"/>`; });
      if (s.label) { const p = s.labelAt || s.pts[s.pts.length - 1]; g += text(X(p[0]) + 6, Y(p[1]) - 6, s.label, `tx sl${i}`, 'start'); }
    });
    (o.marks || []).forEach(m => { g += mk(X(m[0]), Y(m[1]), m[2]); });
    return svg(W, H, g, o.label || 'Graph');
  }
  function fmtTick(v) { return Math.abs(v) < 1e-9 ? '0' : (+v.toFixed(3)).toString(); }
  // Bohr diagram for an atom or ion: shells 2, 8, 8, 2 (elements 1–20)
  function bohr(sym, Z, N, charge = 0, opts = {}) {
    const e = Z - charge, shells = [], cap = [2, 8, 8, 8]; let left = e;
    for (let i = 0; i < 4 && left > 0; i++) { const k = Math.min(cap[i], left); shells.push(k); left -= k; }
    const n = shells.length, R0 = 30, step = 26, S = 2 * (R0 + step * n) + 30, c = S / 2;
    let g = circle(c, c, R0 - 6, 'nuc') + (opts.hideNucleus ? text(c, c + 5, '?', 'tx') : text(c, c - 2, `${Z}p`, 'tx sm') + text(c, c + 12, `${N}n`, 'tx sm'));
    shells.forEach((k, i) => {
      const r = R0 + step * (i + 0.5);
      g += circle(c, c, r, 'shell');
      for (let j = 0; j < k; j++) {
        const ang = -Math.PI / 2 + (i === 0 ? j * Math.PI : (Math.floor(j / 2) * Math.PI / 2 + (j % 2 ? 0.28 : -0.28)));
        g += circle(c + r * Math.cos(ang), c + r * Math.sin(ang), 4.2, 'el');
      }
    });
    if (charge) g = `<text x="${S - 6}" y="16" class="tx" text-anchor="end">${charge > 0 ? (charge > 1 ? charge : '') + '+' : (charge < -1 ? -charge : '') + '−'}</text>` + g;
    return svg(S, S, g, `Bohr diagram of ${sym}`);
  }
  // Lewis (electron dot) symbol for an atom with v valence electrons
  function lewis(sym, v) {
    // fill singly top, right, bottom, left, then pair up (Hund-style, as taught)
    const S = 110, c = S / 2, pos = [[0, -26], [26, 0], [0, 26], [-26, 0]], along = [[1, 0], [0, 1], [1, 0], [0, 1]];
    const k = [0, 0, 0, 0]; for (let i = 0; i < v; i++) k[i % 4]++;
    let g = text(c, c + 9, sym, 'tx big');
    k.forEach((n, side) => {
      const [px, py] = pos[side], [ax, ay] = along[side];
      if (n === 1) g += circle(c + px, c + py, 3.6, 'el');
      if (n === 2) g += circle(c + px - ax * 6, c + py - ay * 6, 3.6, 'el') + circle(c + px + ax * 6, c + py + ay * 6, 3.6, 'el');
    });
    return svg(S, S, g, `Lewis symbol of ${sym}`);
  }
  // free-body diagram: forces = [{dir:'up'|'down'|'left'|'right', label}]
  function fbd(forces, w = 340, h = 280, body = 'box') {
    const cx = w / 2, cy = h / 2, bw = 70, bh = 50; let g = '';
    g += body === 'dot' ? circle(cx, cy, 6, 'el') : rect(cx - bw / 2, cy - bh / 2, bw, bh, 'bx', 4);
    const L = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    forces.forEach(F => {
      const [dx, dy] = L[F.dir], len = F.len || 80, sx = cx + dx * (dx ? bw / 2 : 0), sy = cy + dy * (dy ? bh / 2 : 0);
      g += arrow(sx, sy, sx + dx * len, sy + dy * len, 'ar');
      const tx = sx + dx * (len + (dx ? 12 : 0)) + (dy ? 14 : 0), ty = sy + dy * (len + (dy ? 14 : 0)) + (dx ? -8 : 4);
      g += text(tx, ty, F.label, 'tx', dx < 0 ? 'end' : 'start');
    });
    return svg(w, h, g, 'Free-body diagram');
  }
  return { svg, line, text, rect, circle, path, mk, arrow, graph, bohr, lewis, fbd };
})();

      case 'order': return q.items.map((x, i) => `${i + 1}. ${x}`).join(' → ');
      case 'sort': return q.bins.map((b, j) => `<b>${b}:</b> ${q.items.filter(it => it[1] === j).map(it => it[0]).join('; ')}`).join('<br>');
      case 'label': return q.labels.map((l, i) => `${i + 1} = ${l}`).join(', ');
      default: return '';
    }
  }
  function solutionHTML(q) {
    let h = '';
    if (q.steps && q.steps.length) h += `<div class="sol"><h4>Worked solution</h4><ol>${q.steps.map(s => `<li>${s}</li>`).join('')}</ol></div>`;
    if (q.why) h += `<div class="sol"><h4>Why</h4>${q.why}</div>`;
    return h;
  }
  function doCheck() {
    const { inst, t, u } = CUR; if (CUR.done) return;
    let score, h = '';
    if (inst.type === 'parts') {
      const scores = inst.parts.map((p, i) => p.type === 'self' ? null : mark(p, `p${i}`));
      const auto = scores.filter(x => x !== null);
      inst.parts.forEach((p, i) => {
        const el = $(`.part[data-part="${i}"]`);
        if (p.type === 'self') el.insertAdjacentHTML('beforeend', selfBlock(p, `p${i}`));
        else el.insertAdjacentHTML('beforeend', `<div class="fb ${scores[i] === 1 ? 'good' : 'bad'}"><div>${scores[i] === 1 ? '✅ Correct.' : `❌ Answer: <b class="v">${answerText(p)}</b>`}</div>${solutionHTML(p)}</div>`);
      });
      const selfParts = inst.parts.map((p, i) => p.type === 'self' ? i : -1).filter(i => i >= 0);
      if (selfParts.length) {
        CUR.pendingSelf = { auto, selfParts };
        $('#qbtns').innerHTML = `<button type="button" class="btn primary" id="recordbtn">Record my score</button>`;
        $('#recordbtn').addEventListener('click', () => {
          const sp = selfParts.map(i => { const boxes = $$(`#ck-p${i} input`); return boxes.filter(b => b.checked).length / boxes.length; });
          finish([...auto, ...sp].reduce((a, b) => a + b, 0) / (auto.length + sp.length));
        });
        return;
      }
      score = auto.reduce((a, b) => a + b, 0) / auto.length;
      h = solutionHTML(inst);
      $('#fb').innerHTML = h ? `<div class="fb info">${h}</div>` : '';
      finish(score, true);
      return;
    }
    if (inst.type === 'order' && inst._seq.length < inst.items.length) { toast('Place every item first.'); return; }
    if (inst.type === 'mcq' && inst._pick == null) { toast('Choose an answer first.'); return; }
    score = mark(inst, 'm');
    $('#fb').innerHTML = `<div class="fb ${score === 1 ? 'good' : 'bad'}"><div>${score === 1 ? '✅ <b>Correct.</b>' : score > 0 ? `🟡 <b>${Math.round(score * 100)}% right.</b> Correct answer: <b class="v">${answerText(inst)}</b>` : `❌ <b>Not quite.</b> Correct answer: <b class="v">${answerText(inst)}</b>`}</div>${solutionHTML(inst)}</div>`;
    finish(score, true);
  }
  function selfBlock(q, k) {
    return `<div class="fb info"><div><b>Model answer</b></div><div class="model">${q.model}</div>
      <div class="small">Tick each point your answer made clearly${q.marksNote ? ` (${q.marksNote})` : ''}:</div>
      <div class="check" id="ck-${k}">${q.check.map((c, i) => `<label><input type="checkbox" data-c="${i}"> <span>${c}</span></label>`).join('')}</div>${q.why ? `<div class="sol"><h4>Level guide</h4>${q.why}</div>` : ''}</div>`;
  }
  function doReveal() {
    const { inst } = CUR; const ta = $('#in-m');
    if (ta && !ta.value.trim() && !confirm('You have not written anything yet. Writing your answer first is the best practice. Show the model answer anyway?')) return;
    if (ta) ta.readOnly = true;
    $('#fb').innerHTML = selfBlock(inst, 'm');
    $('#qbtns').innerHTML = `<button type="button" class="btn primary" id="recordbtn">Record my score</button>`;
    $('#recordbtn').addEventListener('click', () => { const boxes = $$('#ck-m input'); finish(boxes.filter(b => b.checked).length / boxes.length); });
  }
  function finish(score) {
    const { t, u, inst } = CUR; CUR.done = true;
    const k = qkey(u, t), r = S.q[k] || { n: 0, c: 0 }; r.n++; r.c += score; r.last = score; S.q[k] = r;
    const us = S.u[u.id] || (S.u[u.id] = {}); const ss = us[t.s] || (us[t.s] = {}); const bs = ss[t.b] || (ss[t.b] = { n: 0, s: 0 }); bs.n++; bs.s += score;
    save();
    const rec = $('#recordbtn'); if (rec) $('#fb').insertAdjacentHTML('afterbegin', `<div class="fb ${score >= 0.75 ? 'good' : 'bad'}"><b>Recorded: ${Math.round(score * 100)}%</b></div>`);
    $('#qbtns').innerHTML = `<button type="button" class="btn primary" id="nextbtn">Next question</button>${inst.fixedQ ? '' : '<button type="button" class="btn" id="againbtn">Same question, new values</button>'}<span class="tally">${tallyText(u)}</span>`;
    $('#nextbtn').addEventListener('click', () => newQuestion());
    const ag = $('#againbtn'); if (ag) ag.addEventListener('click', () => newQuestion(true));
    $('#nextbtn').focus();
  }
  function tallyText(u) {
    let n = 0, s = 0; Object.values(S.u[u.id] || {}).forEach(st => Object.values(st).forEach(b => { n += b.n; s += b.s; }));
    return n ? `Unit: ${n} done · ${Math.round(s / n * 100)}% average` : '';
  }

  /* ---------- recall (Leitner boxes 0–5) ---------- */
  let RQ = null;
  function decks() {
    const ds = liveUnitsOf(S.year).map(u => ({ id: u.id, name: `${u.em} ${u.title}`, cards: CONTENT[u.id].cards.map((c, i) => ({ key: `${u.id}#${c[0]}`, t: c[0], d: c[1] })) }));
    ds.push({ id: 'cmd', name: '🗣️ Command terms', cards: COMMAND_TERMS.map(c => ({ key: `cmd#${c[0]}`, t: c[0], d: c[1] })) });
    return ds;
  }
  function viewRecall() {
    const ds = decks(); let d = ds.find(x => x.id === S.recallDeck) || ds[0];
    const box = (c) => S.r[c.key] || 0;
    const counts = [0, 0, 0, 0, 0, 0]; d.cards.forEach(c => counts[box(c)]++);
    if (!RQ || RQ.deck !== d.id) { const R = makeR(newSeed()); RQ = { deck: d.id, q: R.shuffle(d.cards).sort((a, b) => box(a) - box(b)), i: 0, flip: false }; }
    const c = RQ.q[RQ.i % RQ.q.length];
    const front = S.recallFlip ? c.d : c.t, back = S.recallFlip ? c.t : c.d;
    app.innerHTML = `<section class="panel"><h3>Recall 🧠</h3><div class="decks">${ds.map(x => `<button type="button" class="btn${x.id === d.id ? ' primary' : ''}" data-deck="${x.id}">${x.name}</button>`).join('')}</div>
      <p class="small" style="margin-top:10px">Say the answer out loud, then flip. Cards you know move up a box; cards you miss go back to box 0 and come round again sooner.</p>
      <div class="ansrow"><label class="toggle"><input type="checkbox" id="rflip" ${S.recallFlip ? 'checked' : ''}> Show the definition first</label></div></section>
      <div class="card flash" id="flash" tabindex="0" role="button" aria-label="Flip card">${RQ.flip ? `<div><div class="small">${esc(front)}</div><div class="def" style="margin-top:10px">${S.recallFlip ? `<span class="term">${esc(back)}</span>` : esc(back)}</div></div>` : `<div>${S.recallFlip ? `<div class="def">${esc(front)}</div>` : `<div class="term">${esc(front)}</div>`}<div class="small" style="margin-top:12px">Tap to flip</div></div>`}</div>
      <div class="btns" style="margin-top:12px">${RQ.flip ? '<button type="button" class="btn" id="again">❌ Missed it</button><button type="button" class="btn primary" id="got">✅ Got it</button>' : '<button type="button" class="btn primary" id="flipbtn">Flip</button>'}
        <span class="boxes">${counts.map((n, i) => `<span title="Box ${i}">Box ${i}: ${n}</span>`).join('')}</span></div>`;
    $$('[data-deck]', app).forEach(b => b.addEventListener('click', () => { S.recallDeck = b.dataset.deck; save(); RQ = null; viewRecall(); }));
    $('#rflip').addEventListener('change', (e) => { S.recallFlip = e.target.checked; save(); RQ.flip = false; viewRecall(); });
    const flip = () => { RQ.flip = !RQ.flip; viewRecall(); };
    $('#flash').addEventListener('click', flip); $('#flash').addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    const fb = $('#flipbtn'); if (fb) fb.addEventListener('click', flip);
    const next = (ok) => {
      S.r[c.key] = ok ? Math.min(5, box(c) + 1) : 0; save();
      if (!ok) RQ.q.splice(Math.min(RQ.q.length, RQ.i + 4), 0, c); // see it again soon
      RQ.i++; RQ.flip = false; viewRecall();
    };
    const g = $('#got'); if (g) { g.addEventListener('click', () => next(true)); $('#again').addEventListener('click', () => next(false)); }
  }

  /* ---------- notes ---------- */
  function viewNotes() {
    const live = liveUnitsOf(S.year);
    if (!live.length) { app.innerHTML = `<section class="panel"><p>Notes for this year are coming soon.</p></section>`; return; }
    const u = live.find(x => x.id === S.notesUnit[S.year]) || curUnit() || live[0], C = CONTENT[u.id];
    app.innerHTML = `<section class="panel"><div class="decks">${live.map(x => `<button type="button" class="btn${x === u ? ' primary' : ''}" data-nu="${x.id}">${x.em} ${x.title}</button>`).join('')}</div></section>
      <section class="panel notes"><h2>${u.em} Unit ${u.n}: ${u.title} <span class="pill">${u.subject}</span></h2>
        <dl class="kv"><dt>Statement of inquiry</dt><dd>${u.soi}</dd>${C.flow ? `<dt>Lesson flow</dt><dd>${C.flow.join(' → ')}</dd>` : ''}<dt>Class slides</dt><dd><a href="${DECKS[u.y]}" target="_blank" rel="noopener">Year ${u.y} Science Notes (Google Slides)</a></dd></dl>
        ${C.notes.map(n => `<h3>${n.h}</h3>${n.p ? `<p>${n.p}</p>` : ''}${n.pts ? `<ul>${n.pts.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}${n.fig ? `<div class="figure">${n.fig}</div>` : ''}`).join('')}
        <h3>Key terms</h3><dl class="terms">${C.cards.map(c => `<dt>${c[0]}</dt><dd>${c[1]}</dd>`).join('')}</dl></section>`;
    $$('[data-nu]', app).forEach(b => b.addEventListener('click', () => { S.notesUnit[S.year] = b.dataset.nu; save(); viewNotes(); }));
  }

  /* ---------- progress ---------- */
  function viewProgress() {
    const cell = (st) => { let n = 0, s = 0; Object.values(st || {}).forEach(b => { n += b.n; s += b.s; }); return n ? `<td class="c">${Math.round(s / n * 100)}%<div class="bar"><i style="width:${Math.round(s / n * 100)}%"></i></div><span class="small">${n} done</span></td>` : '<td class="c small">–</td>'; };
    const rows = YEARS.map(Y => { const L = liveUnitsOf(Y.y); return L.length ? `<tr><th colspan="5">${Y.label} <span class="small">${Y.note}</span></th></tr>` + L.map(u => {
      const rc = CONTENT[u.id].cards, known = rc.filter(c => (S.r[`${u.id}#${c[0]}`] || 0) >= 3).length;
      return `<tr><td>${u.em} ${u.title}</td>${STRANDS.map(s => cell((S.u[u.id] || {})[s.id])).join('')}<td class="c">${known}/${rc.length}</td></tr>`; }).join('') : ''; }).join('');
    const bands = (u) => STRANDS.map(s => `<tr><td>${s.label}</td>${BANDS.map(b => { const x = ((S.u[u.id] || {})[s.id] || {})[b]; return `<td class="c">${x ? `${Math.round(x.s / x.n * 100)}% <span class="small">(${x.n})</span>` : '–'}</td>`; }).join('')}</tr>`).join('');
    app.innerHTML = `<section class="panel"><h3>Progress 📈</h3><p class="small">Average score in Practice for each strand. Recall shows cards in box 3 or higher.</p>
      <div class="tablewrap"><table class="prog"><thead><tr><th>Unit</th>${STRANDS.map(s => `<th class="c">${s.label}</th>`).join('')}<th class="c">Recall</th></tr></thead><tbody>${rows}</tbody></table></div></section>
      ${liveUnitsOf(S.year).map(u => `<section class="panel"><h3>${u.em} ${u.title}: by level</h3><div class="tablewrap"><table class="prog"><thead><tr><th>Strand</th>${BANDS.map(b => `<th class="c">${BAND_LABEL[b]}</th>`).join('')}</tr></thead><tbody>${bands(u)}</tbody></table></div></section>`).join('')}
      <section class="panel"><h3>Back up</h3><p class="small">Progress is stored in this browser only. Save a backup file to move it to another device.</p>
        <div class="btns"><button type="button" class="btn" id="exp">Save backup file</button><label class="btn">Load backup file<input type="file" id="imp" accept=".json,application/json" class="hidden"></label><button type="button" class="btn" id="reset">Reset all progress</button></div></section>`;
    $('#exp').addEventListener('click', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = `science-lab-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click(); });
    $('#imp').addEventListener('change', async (e) => { const f = e.target.files[0]; if (!f) return; try { const d = JSON.parse(await f.text()); if (d.v !== 1) throw 0; S = { ...DEF, ...d }; save(); toast('Backup loaded.'); render(); } catch (err) { toast('That file is not a Science Lab backup.'); } });
    $('#reset').addEventListener('click', () => { if (confirm('Delete all progress on this device? This cannot be undone.')) { S = { ...DEF, year: S.year, theme: S.theme }; save(); render(); } });
  }

  setTheme(); render();
  // test hooks: show one exact template with a given seed
  window.__LAB = { S: () => S, CONTENT, go, cur: () => CUR,
    force(uid, tid, seed) { const u = unitById(uid); S.year = u.y; S.unit[u.y] = uid; S.tab = 'practice'; const t = CONTENT[uid].qs.find(x => x.id === tid); S.strand = t.s; S.band = t.b; S.missed = false; render(); CUR = { t, seed, done: false, u }; CUR.inst = build(t, seed); drawCard(); } };
})();

</script>
</body>
</html>
